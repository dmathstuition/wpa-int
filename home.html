<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Whyte Pyramid Academy — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔺</text></svg>" />
</head>
<body>
<div class="wrap">

  <div class="hud">
    <span class="chip">🔺 <b>Whyte Pyramid Academy</b></span>
    <span class="chip" id="whoChip">👤 <b id="whoName">Learner</b></span>
    <button class="btn ghost" id="soundBtn">🔊 Sound</button>
  </div>

  <div class="brand" id="brand">
    <span class="pyr">🔺</span>
    <span class="nm">Whyte Pyramid Academy<small>Learning Home</small></span>
  </div>

  <h1 class="title-pop">🏠 CHOOSE YOUR ADVENTURE 🚀</h1>
  <p class="subtitle">Tap a card to start learning and playing! ⭐</p>

  <div class="weekgrid" id="grid" style="margin-top:26px;"></div>

</div>

<script src="config.js"></script>
<script src="assets/tracker.js"></script>
<script>
var SECTIONS = [
  { title:"Number Foundations", emoji:"🔢", file:"foundations/index.html", tag:"COUNT 1 – 10",
    desc:"Meet each number, count cartoons, and write numbers with your finger.", accent:"linear-gradient(90deg,#ff9f43,#ff5b6b)" },
  { title:"Maths Missions", emoji:"➕", file:"index.html", tag:"ADDITION & SUBTRACTION",
    desc:"Weekly maths quests — column addition, subtraction & SATs reasoning.", accent:"linear-gradient(90deg,#4b8bff,#9b5cff)" },
  { title:"English — Grammar Quest", emoji:"📚", file:"english/index.html", tag:"PARTS OF SPEECH",
    desc:"Nouns, verbs, adjectives, adverbs & pronouns — story-led lessons.", accent:"linear-gradient(90deg,#2bd576,#22d3ee)" },
  { title:"Spelling Games", emoji:"🐝", file:"games/index.html", tag:"LISTEN & SPELL",
    desc:"Spelling Bee, Unscramble & Missing Letters for exam spelling.", accent:"linear-gradient(90deg,#ff3d9a,#ff9f43)" }
];

(function(){
  var nm=(window.MATHQUEST_CONFIG && window.MATHQUEST_CONFIG.ACADEMY_NAME)||"Whyte Pyramid Academy";
  var el=document.querySelector("#brand .nm"); if(el) el.innerHTML=nm+"<small>Learning Home</small>";
  document.title=nm+" — Home";
  var who=(typeof MQ!=="undefined" && MQ.getStudent && MQ.getStudent())||"";
  if(who){ var w=document.getElementById("whoName"); if(w) w.textContent=who; }
})();

var soundBtn=document.getElementById("soundBtn");
function paintSound(){ try{ soundBtn.textContent = MQ.soundEnabled() ? "🔊 Sound" : "🔇 Muted"; }catch(e){} }
soundBtn.onclick=function(){ try{ MQ.toggleSound(); paintSound(); MQ.sound("click"); }catch(e){} };
paintSound();

var grid=document.getElementById("grid");
SECTIONS.forEach(function(s,i){
  var el=document.createElement("div");
  el.className="weekcard"; el.style.cursor="pointer"; el.style.animationDelay=(i*0.08)+"s";
  el.innerHTML=
    '<div class="emoji">'+s.emoji+'</div>'+
    '<h3>'+s.title+'</h3>'+
    '<p class="muted" style="min-height:56px;font-size:14px;">'+s.desc+'</p>'+
    '<span class="tag live">▶ '+s.tag+'</span>';
  el.onclick=function(){ try{ MQ.sound("click"); }catch(e){} window.location.href=s.file; };
  grid.appendChild(el);
});
</script>
</body>
</html>
