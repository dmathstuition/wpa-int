  .ctrls { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:12px; }

  .btn.subb { background:linear-gradient(160deg,#ff9a6b,#ff5b3b); color:#fff; }

  /* undo pairs */
  .pairs { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  .pair { background:#fff; border:3px solid var(--line); border-radius:18px; padding:12px; display:flex; align-items:center; justify-content:space-between; gap:6px; opacity:0; transform:translateY(16px); transition:all .5s; }
  .pair.show { opacity:1; transform:none; }
  .pair .pe { font-size:34px; text-align:center; width:84px; }
  .pair .pe small { display:block; font-size:12px; font-weight:800; color:#6a62a0; }
  .pair .arrows { font-size:13px; font-weight:800; text-align:center; color:#6a62a0; }

  /* number line */

  svg.nl .tk { stroke:#2d2559; stroke-width:1.5; }
  svg.nl .tl { font:800 13px 'Baloo 2',system-ui,sans-serif; fill:#5b5390; text-anchor:middle; }
  svg.nl .arcF { fill:none; stroke:var(--add); stroke-width:3; stroke-dasharray:6 5; }
  svg.nl .arcB { fill:none; stroke:var(--sub); stroke-width:3; stroke-dasharray:6 5; }

  .mat { display:grid; grid-template-columns:1.6fr 1fr 1fr; gap:10px; }

  .pcol h4 { margin:0 0 6px; text-align:center; font-size:15px; color:#4a4470; }
  .blocks { flex:1; display:flex; flex-wrap:wrap; gap:5px; align-content:flex-start; justify-content:center; }

  .blk { transition:transform .65s cubic-bezier(.2,1.3,.4,1), opacity .5s; }
  .blk.incoming { transform:translateY(-140px) scale(.5); opacity:0; }
  .blk.outgoing { transform:translateY(-140px) rotate(-25deg) scale(.6); opacity:0; }

  .rod { width:10px; height:50px; border:2px solid #2e6fd8; border-radius:3px; background-color:#8cc0ff; background-image:linear-gradient(#2e6fd8 1px,transparent 1px); background-size:100% 4.8px; }

  .bm .whole { background:linear-gradient(90deg,#a78bfa,#7c3aed); margin-bottom:8px; }
  .bm .parts { display:flex; gap:0; }

  .bm .p2 { background:linear-gradient(90deg,#fbbf24,#d97706); border-radius:0 12px 12px 0; }
  .bm .lbl { display:flex; justify-content:space-between; font-weight:800; color:#6a62a0; font-size:13px; margin-top:4px; }
  .facts { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px; }
  @media (max-width:560px){ .facts { grid-template-columns:1fr; } }
  .fact { background:#fff; border:3px solid var(--line); border-radius:14px; padding:10px; text-align:center; font-size:24px; font-weight:800; opacity:0; transform:scale(.6); transition:all .45s cubic-bezier(.2,1.4,.4,1); }
  .fact.show { opacity:1; transform:none; }
  .fact small { display:block; font-size:12px; color:#6a62a0; }

  /* triangle */
  svg.tri { width:100%; max-width:340px; display:block; margin:0 auto; }
  svg.tri .node { cursor:pointer; }
  svg.tri .node circle { stroke:#fff; stroke-width:5; transition:fill .3s; }
  svg.tri .node text { font:800 28px 'Baloo 2',system-ui,sans-serif; fill:#fff; text-anchor:middle; pointer-events:none; }
  svg.tri .node.hid circle { fill:#c9c3e6 !important; }

  /* worked checks */
  .wcards { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; }
  .wcard { background:#fff; border:3px solid var(--line); border-radius:18px; padding:14px; position:relative; overflow:hidden; }
  .wcard .who { font-weight:800; font-size:17px; color:#4a4470; }
  .wline { font-size:22px; font-weight:800; margin:8px 0; opacity:0; transform:translateX(-14px); transition:all .45s; }
  .wline.show { opacity:1; transform:none; }
  .wline small { display:block; font-size:13px; color:#6a62a0; }
  .stamp { position:absolute; right:10px; top:8px; font-size:44px; transform:scale(0) rotate(-30deg); transition:transform .45s cubic-bezier(.2,1.6,.4,1); }

  .qbox { display:inline-block; min-width:62px; padding:0 8px; border:3px dashed var(--whole); border-radius:10px; color:var(--whole); background:#f5f0ff; text-align:center; }
  .qbox.found { border-style:solid; background:#ede4ff; animation:pop .5s; }

  /* poster */
  .poster { display:grid; gap:12px; }
  .rule { border-radius:18px; padding:14px 16px; color:#fff; font-weight:800; font-size:19px; }
  .rule .ex { display:block; font-size:22px; margin-top:4px; background:rgba(255,255,255,.18); border-radius:10px; padding:4px 10px; }

  /* practice */
  .pq { font-size:clamp(24px,6vw,32px); font-weight:800; text-align:center; color:var(--ink); margin:10px 0; line-height:1.5; }
  .ansin { width:140px; font-size:30px; font-weight:800; text-align:center; border:4px solid var(--purple); border-radius:14px; padding:4px; font-family:inherit; color:var(--ink); }
  .work { margin-top:10px; background:#f4f1ff; border-radius:12px; padding:10px 12px; font-weight:800; color:#4a4470; font-size:18px; text-align:center; }
  .lvlcards { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-top:12px; }
  .modegrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:16px; }
  .modecard { text-align:center; cursor:pointer; }
  details.tnotes summary { cursor:pointer; font-weight:800; font-size:18px; color:var(--ink); }
  details.tnotes li { font-weight:700; color:#4a4470; line-height:1.55; margin:4px 0; }
  @media (max-width:520px){ .mat { grid-template-columns:1.3fr 1fr 1fr; gap:6px; } .flat{ width:40px;height:40px;background-size:3.8px 3.8px;} .rod{height:40px;background-size:100% 3.8px;} .machine{ width:124px; margin-left:-62px; } .mball{ width:66px; margin-left:-33px; font-size:20px; } }
</style>

/* =============================================================
   THE UNDO BUTTON — inverse of addition and subtraction (Year 3)
   Every number used is a 3-digit number: 100 ≤ n ≤ 999.
   Big idea:  + plays forward ▶   − rewinds ⏪
   Main example used across the lesson:  243 + 125 = 368
   ============================================================= */
var A=243, B=125, C=368;
var ROBOT="🤖";

function el(id){ return document.getElementById(id); }
function rnd(lo,hi){ return lo+Math.floor(Math.random()*(hi-lo+1)); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function is3(n){ return n>=100 && n<=999; }
var screen=el("screen");

/* --- animation housekeeping: every step change cancels pending timers --- */
var token=0;
function newRun(){ token++; return token; }
function later(fn,ms){ var t=token; setTimeout(function(){ if(t===token) fn(); },ms); }
function tween(ms, step, done){
  var t=token, t0=null;
  function f(ts){ if(t!==token) return; if(t0===null) t0=ts; var k=Math.min(1,(ts-t0)/ms); step(k); if(k<1) requestAnimationFrame(f); else if(done) done(); }
  requestAnimationFrame(f);
}

/* --- brand / sound / learner --- */
(function(){ var nm=(window.MATHQUEST_CONFIG&&window.MATHQUEST_CONFIG.ACADEMY_NAME)||"Whyte Pyramid Academy";
  var e=document.querySelector("#brand .nm"); if(e) e.innerHTML=nm+"<small>Maths · Year 3</small>";
  document.title="The Undo Button | "+nm; })();
var soundBtn=el("soundBtn");
function paintSound(){ soundBtn.textContent=MQ.soundEnabled()?"🔊":"🔇"; }
soundBtn.onclick=function(){ MQ.toggleSound(); paintSound(); }; paintSound();
var student=MQ.getStudent()||"";
if(student) el("whoName").textContent=student;
el("menuLink").onclick=function(e){ e.preventDefault(); menu(); };

/* =============================================================
   HERO picture: the forward / rewind loop
   ============================================================= */
function heroSVG(){
  return '<svg viewBox="0 0 520 190" xmlns="http://www.w3.org/2000/svg">'+
    '<defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16b364"/></marker>'+
    '<marker id="ahr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6a3d"/></marker></defs>'+
    '<path class="spinA" d="M120,80 C200,10 320,10 400,80" fill="none" stroke="#16b364" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#ah)"/>'+
    '<path class="spinA" d="M400,112 C320,182 200,182 120,112" fill="none" stroke="#ff6a3d" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#ahr)"/>'+
    '<rect x="260" y="8" width="0" height="0"/>'+
    '<g><rect x="208" y="14" width="104" height="38" rx="19" fill="#16b364"/><text x="260" y="41" text-anchor="middle" font-size="24" font-weight="800" fill="#fff" font-family="Baloo 2,system-ui">▶ + '+B+'</text></g>'+
    '<g><rect x="208" y="140" width="104" height="38" rx="19" fill="#ff6a3d"/><text x="260" y="167" text-anchor="middle" font-size="24" font-weight="800" fill="#fff" font-family="Baloo 2,system-ui">⏪ − '+B+'</text></g>'+
    '<circle cx="80" cy="96" r="54" fill="#3b82f6"/><text x="80" y="107" text-anchor="middle" font-size="34" font-weight="800" fill="#fff" font-family="Baloo 2,system-ui">'+A+'</text>'+
    '<circle cx="440" cy="96" r="54" fill="#8b5cf6"/><text x="440" y="107" text-anchor="middle" font-size="34" font-weight="800" fill="#fff" font-family="Baloo 2,system-ui">'+C+'</text>'+
    '</svg>';
}

/* =============================================================
   MENU
   ============================================================= */
function menu(){
  newRun();
  screen.innerHTML=
    '<h1 class="title-pop">⏪ THE UNDO BUTTON ▶</h1>'+
    '<p class="subtitle">Inverse of addition and subtraction · Year 3 · 3-digit numbers</p>'+
    '<div class="card hero center" style="margin-top:16px;">'+heroSVG()+
      '<div class="robot" style="max-width:620px;margin:10px auto 0;"><div class="rb">'+ROBOT+'</div><div class="speech">Hi, I\'m <b>Rewind</b>! Adding moves you <b class="add">forward ▶</b>. Subtracting the same amount presses <b class="sub">rewind ⏪</b> and takes you straight back. They <b>undo</b> each other. That is called the <b>INVERSE</b>!</div></div>'+
    '</div>'+
    '<div class="modegrid">'+
      '<div class="card modecard" id="goLesson" style="border-top:10px solid var(--purple);"><div class="mascot">📖</div><h2>Animated Lesson</h2><p class="muted" style="font-weight:700;">9 short steps: number line, base-10 blocks, the Undo Machine, bar model, fact family triangle, checking answers and missing numbers.</p><span class="tag live">▶ START LESSON</span></div>'+
      '<div class="card modecard" id="goPractice" style="border-top:10px solid #16b364;"><div class="mascot">🎮</div><h2>Practice Game</h2><p class="muted" style="font-weight:700;">10 questions using the inverse. Choose Level 1 (no exchanging) or Level 2 (with exchanging). Scores are saved for your tutor.</p><span class="tag live">▶ PRACTISE</span></div>'+
    '</div>'+
    '<div class="card" style="margin-top:16px;"><details class="tnotes"><summary>👩‍🏫 Tutor notes — how to teach this in about 30 minutes</summary><ol>'+
      '<li><b>Hook (3 min):</b> do real “undo” actions together: open/close the door, stand up/sit down, take 3 steps forward / 3 steps back. Ask: “What undoes it?”</li>'+
      '<li><b>Number line (5 min):</b> let the learner press the hop buttons. Say the hops aloud: “plus one hundred, plus twenty, plus five… now rewind!”</li>'+
      '<li><b>Blocks (5 min):</b> point out the <b>orange</b> blocks are the 125 we added. Taking exactly those away must bring us back to 243.</li>'+
      '<li><b>Undo Machine &amp; bar model (6 min):</b> press 🎲 New numbers a few times. Ask the learner to predict the rewind answer <i>before</i> pressing.</li>'+
      '<li><b>Fact family triangle (4 min):</b> hide a number and ask “Do we add or subtract to find it?” Top hidden → <b>add</b>. Bottom hidden → <b>subtract</b>.</li>'+
      '<li><b>Check &amp; missing numbers (4 min):</b> stress: “When you finish a sum, press rewind to check it!”</li>'+
      '<li><b>Practice (5+ min):</b> Level 1 first. Move to Level 2 when they score 8 or more.</li>'+
      '</ol><p class="muted" style="font-weight:700;">All numbers stay as 3-digit numbers (100 to 999). Key sentence to repeat: <b>“Adding and subtracting are inverses, so one undoes the other.”</b></p></details></div>';
  el("goLesson").onclick=function(){ MQ.sound("click"); lesson(0); };
  el("goPractice").onclick=function(){ MQ.sound("click"); practiceMenu(); };

   LESSON
   ============================================================= */
var STEPS=[
  { t:"What does ‘inverse’ mean?", e:"🔄", say:"An <b>inverse</b> is an <b>UNDO</b>. It takes you back to where you started. Watch these everyday undos!", tutor:"Act them out together. Then say: “Adding and subtracting are inverses. They undo each other.”", render:stepUndo },
  { t:"Hop forward, hop back", e:"🐸", say:"Freddie the frog starts on <b class='n1'>"+A+"</b>. He hops <b class='add'>forward "+B+"</b>, then <b class='sub'>back "+B+"</b>. Where does he land?", tutor:"Count each hop aloud: +100, +20, +5. Then rewind: −5, −20, −100. He always lands back on 243!", render:stepLine },
  { t:"Build it with blocks", e:"🧱", say:"Here is <b class='n1'>"+A+"</b> in base-10 blocks: 2 hundreds, 4 tens and 3 ones. Let's <b class='add'>add "+B+"</b>, then <b class='sub'>take away "+B+"</b>.", tutor:"The orange blocks are the 125 we added. Taking away exactly those blocks undoes the addition.", render:stepBlocks },
  { t:"The Undo Machine", e:"🏭", say:"My machine adds a number. Its <b class='sub'>REWIND</b> setting subtracts the same number, so the output goes back to the input!", tutor:"Press 🎲 New numbers and ask: “What will come out when we rewind?” Let the learner predict first.", render:stepMachine },
  { t:"Part + part = whole", e:"📊", say:"<b class='n1'>"+A+"</b> and <b class='n2'>"+B+"</b> are the <b>parts</b>. Together they make the <b class='nw'>whole</b>, "+C+". Watch the four facts appear!", tutor:"Point to the bar: two parts make the whole. Whole take away a part leaves the other part.", render:stepBar },
  { t:"The fact family triangle", e:"🔺", say:"The <b class='nw'>whole</b> sits at the top, and the <b>parts</b> sit at the bottom. <b>Tap any number to hide it</b>, and I'll show you how to find it!", tutor:"Rule: top hidden → ADD the bottom two. A bottom one hidden → SUBTRACT (top − the other).", render:stepTriangle },
  { t:"Check your answer!", e:"🔍", say:"After you add, press <b class='sub'>rewind</b> to <b>check</b>. If you land back on your starting number, your answer is right!", tutor:"Ola is right. Mia made a mistake, and the inverse check catches it!", render:stepCheck },
  { t:"Find the missing number", e:"❓", say:"A number is hiding behind the box! Use the <b>inverse</b> to find it.", tutor:"Ask: “Is the box a part or the whole?” A missing part → subtract. A missing whole (the start of a subtraction) → add.", render:stepMissing },
  { t:"Remember!", e:"⭐", say:"You've learned the Undo Button! Here are the three things to remember.", tutor:"Ask the learner to explain each rule back to you in their own words.", render:stepPoster }

function lesson(i){

/* ---------- Step 2: number line with hops ---------- */
function stepLine(st){
  var a=A, b=B;
  function draw(){
    var c=a+b, lo=Math.floor(a/100)*100, hi=Math.ceil(c/100)*100; if(hi-lo<200) hi=lo+200;
    var X=function(n){ return 40+(n-lo)/(hi-lo)*680; };
    var g='<svg class="nl" viewBox="0 0 760 230" xmlns="http://www.w3.org/2000/svg"><line class="ax" x1="30" y1="130" x2="730" y2="130"/>';
    for(var n=lo;n<=hi;n+=10){ var big=(n%50===0); g+='<line class="tk" x1="'+X(n)+'" y1="'+(130-(big?10:5))+'" x2="'+X(n)+'" y2="'+(130+(big?10:5))+'"/>'; if(big) g+='<text class="tl" x="'+X(n)+'" y="'+(n%100===0?160:156)+'">'+n+'</text>'; }
    g+='<circle cx="'+X(a)+'" cy="130" r="7" fill="#3b82f6"/><text class="tl" x="'+X(a)+'" y="205" style="font-size:18px;fill:#3b82f6">start '+a+'</text>';
    g+='<g id="arcs"></g><text id="frog" x="'+X(a)+'" y="122" font-size="30" text-anchor="middle">🐸</text></svg>';
    st.innerHTML='<div style="overflow-x:auto;">'+g+'</div><div class="big-eq" id="beq"></div>'+
      '<div class="ctrls"><button class="btn addb" id="fw">▶ Hop forward + '+b+'</button><button class="btn subb" id="bk" disabled>⏪ Rewind − '+b+'</button>'+
      '<button class="btn ghost" id="rs">🔁 Reset</button><button class="btn ghost" id="nn">🎲 New numbers</button></div>';
    var parts=[Math.floor(b/100)*100, Math.floor(b/10)%10*10, b%10].filter(function(x){return x>0;});
    var frog=el("frog"), arcs=el("arcs"), pos=a, busy=false;
    function hop(from,to,up,label,col,done){
      var x1=X(from), x2=X(to), xm=(x1+x2)/2, H=Math.max(26,Math.min(120,Math.abs(x2-x1)*0.8));   // arc height grows with hop width
      var cy= up ? 130-H : 130+H;
      arcs.insertAdjacentHTML("beforeend",'<path class="'+(up?"arcF":"arcB")+'" d="M'+x1+',130 Q'+xm+','+cy+' '+x2+',130"/><text class="al" x="'+xm+'" y="'+(up?130-H/2-8:130+H/2+20)+'" fill="'+col+'">'+label+'</text>');
      MQ.sound("click");
      tween(650,function(k){ var x=(1-k)*(1-k)*x1+2*(1-k)*k*xm+k*k*x2, y=(1-k)*(1-k)*130+2*(1-k)*k*cy+k*k*130; frog.setAttribute("x",x); frog.setAttribute("y",(up?y-8:y+24)); }, done);
    }
    function seq(list, up, sign, done){
      var i=0;
      (function go(){ if(i>=list.length) return done();
        var p=list[i++], to=pos+(up?p:-p);
        hop(pos,to,up,(up?"+":"−")+p, up?"#16b364":"#ff6a3d", function(){ pos=to; later(go,180); }); })();
    }
    el("fw").onclick=function(){ if(busy) return; busy=true; el("fw").disabled=true; el("beq").innerHTML="";
      seq(parts,true,"+",function(){ busy=false; el("bk").disabled=false; frog.setAttribute("y",122);
        if(!el("landDot")) arcs.insertAdjacentHTML("beforeend",'<circle id="landDot" cx="'+X(a+b)+'" cy="130" r="7" fill="#8b5cf6"/><text class="tl" x="'+X(a+b)+'" y="205" style="font-size:18px;fill:#8b5cf6">'+(a+b)+'</text>');
        el("beq").innerHTML='<span class="n1">'+a+'</span> <span class="add">+ '+b+'</span> = <span class="nw">'+(a+b)+'</span>'; MQ.sound("correct"); }); };
    el("bk").onclick=function(){ if(busy) return; busy=true; el("bk").disabled=true;
      seq(parts.slice().reverse(),false,"−",function(){ busy=false; frog.setAttribute("y",122);
        el("beq").innerHTML='<span class="nw">'+(a+b)+'</span> <span class="sub">− '+b+'</span> = <span class="n1">'+a+'</span> &nbsp;⏪ back to the start!'; MQ.sound("win"); MQ.confetti(60); }); };
    el("rs").onclick=function(){ newRun(); draw(); };
    el("nn").onclick=function(){ newRun(); a=rnd(100,600); b=rnd(100,Math.min(300,999-a)); draw(); };
  }
  draw();
}

function stepMachine(st){
  var a=A, b=B, busy=false, state="in";
  st.innerHTML='<div class="mstage"><div class="mrail"></div>'+
      '<div class="machine" id="mach"><div class="eyes">👀</div><div class="mlab" id="mlab"></div><div class="gears"><span>⚙️</span><span>⚙️</span></div></div>'+

    '<div class="hist" id="hist"></div>'+
    '<div class="ctrls"><button class="btn addb" id="run"></button><button class="btn subb" id="rew"></button><button class="btn ghost" id="nn">🎲 New numbers</button></div>';
  var ball=el("ball"), mach=el("mach");
  function reset(){
    state="in"; busy=false; mach.classList.remove("rev"); el("mlab").textContent="+ "+b;
    ball.style.transition="none"; ball.style.left="10%"; ball.textContent=a; ball.style.opacity="1"; ball.style.borderColor="var(--p1)";
    void ball.offsetWidth; ball.style.transition="";
    el("run").textContent="▶ Run (+ "+b+")"; el("rew").textContent="⏪ Rewind (− "+b+")";
    el("run").disabled=false; el("rew").disabled=true;
    el("hist").innerHTML='Press <span class="add">▶ Run</span> to send <b>'+a+'</b> through the machine. What will come out? 🤔';
  }
  function through(toPct,newVal,done){
    busy=true; ball.style.left="50%";
    later(function(){ ball.style.opacity="0"; mach.classList.add("work"); MQ.sound("click"); }, 820);
    later(function(){ ball.textContent=newVal; ball.style.opacity="1"; mach.classList.remove("work"); ball.style.left=toPct+"%"; }, 1500);
    later(function(){ busy=false; done(); }, 2450);
  }
  el("run").onclick=function(){ if(busy||state!=="in") return; mach.classList.remove("rev"); el("mlab").textContent="+ "+b; el("run").disabled=true;
    through(90,a+b,function(){ state="out"; el("rew").disabled=false; ball.style.borderColor="var(--whole)";
      el("hist").innerHTML='<span class="n1">'+a+'</span> <span class="add">+ '+b+'</span> = <span class="nw">'+(a+b)+'</span> · now press <span class="sub">⏪ Rewind</span>!'; MQ.sound("correct"); }); };
  el("rew").onclick=function(){ if(busy||state!=="out") return; mach.classList.add("rev"); el("mlab").textContent="− "+b; el("rew").disabled=true;
    through(10,a,function(){ state="in"; el("run").disabled=false; ball.style.borderColor="var(--p1)";
      el("hist").innerHTML='<span class="nw">'+(a+b)+'</span> <span class="sub">− '+b+'</span> = <span class="n1">'+a+'</span> · ⏪ back to where we started!'; MQ.sound("win"); MQ.confetti(60); }); };
  el("nn").onclick=function(){ newRun(); a=rnd(100,600); b=rnd(100,Math.min(399,999-a)); MQ.sound("click"); reset(); };
  reset();
}

      later(function(){ el("m"+i+"_1").classList.add("show"); MQ.confetti(40); }, 2500);
    };
  });
}

/* =============================================================
   PRACTICE GAME — 10 questions, every number 3-digit (100–999)
   ============================================================= */
function makeTrio(level){
  var a,b,tries=0;
  if(level===1){                       // no exchanging: each column sums to 9 or less
    var ah=rnd(1,8), at=rnd(0,9), ao=rnd(0,9);
    var bh=rnd(1,9-ah), bt=rnd(0,9-at), bo=rnd(0,9-ao);
    a=ah*100+at*10+ao; b=bh*100+bt*10+bo;
  } else {                             // with exchanging in at least one column
    do { a=rnd(100,899); b=rnd(100,999-a); tries++; }
    while(tries<500 && !((a%10+b%10)>=10 || (Math.floor(a/10)%10+Math.floor(b/10)%10)>=10));
  }
  return { a:a, b:b, c:a+b };
}
function makeQuestion(kind, level){
  var t=makeTrio(level), a=t.a, b=t.b, c=t.c, v;
  if(kind==="fact"){
    v=rnd(1,3);
    if(v===1) return { type:"in", show:a+" + "+b+" = "+c, ask:c+" − "+b+" = ", ans:a, work:c+" − "+b+" = "+a+" (subtraction undoes the addition)" };
    if(v===2) return { type:"in", show:a+" + "+b+" = "+c, ask:c+" − "+a+" = ", ans:b, work:c+" − "+a+" = "+b+" (whole − one part = the other part)" };
    return { type:"in", show:c+" − "+b+" = "+a, ask:a+" + "+b+" = ", ans:c, work:a+" + "+b+" = "+c+" (addition undoes the subtraction)" };
  }
  if(kind==="missing"){
    v=rnd(1,4);
    if(v===1) return { type:"in", ask:"? + "+b+" = "+c, ans:a, work:"? is a part: "+c+" − "+b+" = "+a };
    if(v===2) return { type:"in", ask:a+" + ? = "+c, ans:b, work:"? is a part: "+c+" − "+a+" = "+b };
    if(v===3) return { type:"in", ask:"? − "+b+" = "+a, ans:c, work:"? is the start, so undo by adding: "+a+" + "+b+" = "+c };
    return { type:"in", ask:c+" − ? = "+a, ans:b, work:"? is a part: "+c+" − "+a+" = "+b };
  }
  if(kind==="check"){
    var right=Math.random()<0.5, x=c;
    if(!right){ var ds=shuffle([10,-10,1,-1,100,-100]); for(var i=0;i<ds.length;i++){ if(is3(c+ds[i]) && is3(a+ds[i])){ x=c+ds[i]; break; } } }   // keep the check working 3-digit too
    if(x===c) right=true;
    var name=shuffle(["Zara","Ben","Kemi","Leo","Ada","Sam"])[0];
    return { type:"yn", ask:name+" says: "+a+" + "+b+" = "+x+". Use the inverse to check. Is "+name+" right?", ans:right?0:1,
      work: x+" − "+b+" = "+(x-b)+(right?" ✅ back to "+a+", so it's right!":" ❌ that's not "+a+", so it's wrong. The answer is "+c+".") };
  }
  // fact-family multiple choice
  var opts=shuffle([c+" − "+b+" = "+a, c+" + "+b+" = "+a, a+" − "+b+" = "+c, b+" + "+c+" = "+a]);
  return { type:"mc", ask:"Which calculation CHECKS "+a+" + "+b+" = "+c+"?", options:opts, ans:opts.indexOf(c+" − "+b+" = "+a), work:c+" − "+b+" = "+a+" rewinds the addition back to the start." };
}

  newRun();
  screen.innerHTML='<div class="card center"><div class="mascot">🎮</div><h1>Undo Practice</h1>'+
    '<div class="speech">10 questions. Use the <b>inverse</b> every time! All numbers are 3-digit numbers.</div>'+
    '<div class="lvlcards">'+
      '<div class="card modecard" id="l1" style="border-top:8px solid #16b364;"><div style="font-size:40px;">⭐</div><h2>Level 1</h2><p class="muted" style="font-weight:700;">No exchanging, e.g. 243 + 125 = 368</p><span class="tag live">▶ PLAY</span></div>'+
      '<div class="card modecard" id="l2" style="border-top:8px solid #ff6a3d;"><div style="font-size:40px;">⭐⭐</div><h2>Level 2</h2><p class="muted" style="font-weight:700;">With exchanging, e.g. 278 + 145 = 423</p><span class="tag live">▶ PLAY</span></div>'+

function practice(level){
  newRun();
  if(!student){
    screen.innerHTML='<div class="card center" style="max-width:520px;"><div class="mascot">'+ROBOT+'</div><div class="speech">What is your name, so your tutor can see your score?</div>'+
      '<div class="row" style="margin-top:14px;"><input class="pill-input" id="nm" placeholder="Your name" maxlength="24" style="flex:1 1 200px;"><button class="btn green" id="nmBtn">Start ▶</button></div></div>';
    el("nmBtn").onclick=function(){ var v=el("nm").value.trim(); if(!v) return; student=v; MQ.setStudent(v); el("whoName").textContent=v; practice(level); };
    el("nm").addEventListener("keydown",function(e){ if(e.key==="Enter") el("nmBtn").click(); });
    return;
  }
  var kinds=shuffle(["fact","fact","fact","missing","missing","missing","check","check","mc","mc"]);
  var Q=kinds.map(function(k){ return makeQuestion(k,level); });
  var i=0, first=0;
  function show(){
    if(i>=Q.length) return finish();
    var q=Q[i], tries=0, settled=false;
    var body='';
    if(q.type==="in"){
      body=(q.show?'<div class="pq" style="color:#6a62a0;font-size:22px;">We know: <b style="color:var(--ink)">'+q.show+'</b></div>':'')+
        '<div class="pq">'+(q.ask.indexOf("?")>=0 ? q.ask.replace("?",'<input class="ansin" id="ans" inputmode="numeric" maxlength="3" autocomplete="off">') : q.ask+'<input class="ansin" id="ans" inputmode="numeric" maxlength="3" autocomplete="off">')+'</div>'+
        '<div class="ctrls"><button class="btn green" id="ck">Check ✅</button></div>';
    } else if(q.type==="yn"){
      body='<div class="pq" style="font-size:22px;">'+q.ask+'</div><div class="ctrls"><button class="btn addb" data-o="0">✅ Yes, right</button><button class="btn subb" data-o="1">❌ No, wrong</button></div>';
    } else {
      body='<div class="pq" style="font-size:22px;">'+q.ask+'</div><div class="options" id="opts">'+q.options.map(function(o,k){ return '<button class="opt" data-o="'+k+'">'+o+'</button>'; }).join("")+'</div>';
    }
    screen.innerHTML='<div class="card'+(i?" still":"")+'"><div class="lhead"><span class="chip" style="background:'+(level===1?"#16b364":"#ff6a3d")+';color:#fff;">🎮 Level '+level+'</span><span class="chip" style="background:#eee;color:#333;">Question '+(i+1)+' / '+Q.length+'</span></div>'+
      '<div class="xpbar" style="background:#eee;margin:12px 0 4px;"><i style="width:'+Math.round(i/Q.length*100)+'%;"></i></div>'+
      body+'<div class="feedback" id="fb"></div><div id="wk"></div><div class="center" id="nx"></div></div>';
    function done(ok){
      if(settled) return; settled=true;
      if(ok && tries===0) first++;
      el("wk").innerHTML='<div class="work">🔁 '+q.work+'</div>';
      el("nx").innerHTML='<button class="btn big green" id="go" style="margin-top:12px;">'+(i+1>=Q.length?"See my score ▶":"Next ▶")+'</button>';
      el("go").onclick=function(){ MQ.sound("click"); i++; show(); }; el("go").focus();
    }
    if(q.type==="in"){
      var inp=el("ans"); inp.focus();
      el("ck").onclick=function(){
        if(settled) return;
        var v=parseInt(inp.value,10), fb=el("fb");
        if(isNaN(v)){ fb.className="feedback"; fb.textContent="Type your answer first ✏️"; return; }
        if(v===q.ans){ fb.className="feedback good"; fb.textContent=tries===0?"🎉 Correct!":"✅ Got it!"; MQ.sound("correct"); MQ.confetti(50); inp.disabled=true; done(true); }
        else { tries++; MQ.sound("wrong");
          if(tries>=2){ fb.className="feedback bad"; fb.innerHTML="The answer is <b>"+q.ans+"</b>."; inp.value=q.ans; inp.disabled=true; done(false); }
          else { fb.className="feedback bad"; fb.textContent="Not quite. Use the inverse and try once more! 🔁"; inp.value=""; inp.focus(); } }
      };
      inp.addEventListener("keydown",function(e){ if(e.key==="Enter") el("ck").click(); });
    } else {
      Array.prototype.forEach.call(document.querySelectorAll("[data-o]"),function(b){
        b.onclick=function(){
          if(settled) return;
          var o=Number(b.getAttribute("data-o")), fb=el("fb");
          document.querySelectorAll("[data-o]").forEach(function(x){ x.disabled=true; });
          if(o===q.ans){ b.classList.add("correct"); fb.className="feedback good"; fb.textContent="🎉 Correct!"; MQ.sound("correct"); MQ.confetti(50); done(true); }
          else { b.classList.add("wrong"); fb.className="feedback bad"; fb.textContent="Not this time. See how the inverse checks it below."; MQ.sound("wrong");
            var r=document.querySelector('[data-o="'+q.ans+'"]'); if(r) r.classList.add("correct"); done(false); }
        };
      });
    }
  }
  function finish(){
    var acc=Math.round(first/Q.length*100), rt=MQ.rating(acc);
    MQ.sound("win"); MQ.confetti(200);
    screen.innerHTML='<div class="card center"><div class="mascot" style="font-size:72px;">'+rt.emoji+'</div><h1>Practice complete!</h1>'+
      '<div class="speech">'+(acc>=80?"Brilliant undoing, ":"Good effort, ")+student+'! '+(level===1&&acc>=80?"You're ready for <b>Level 2</b> ⭐⭐":"Keep using the inverse to check every answer! 🔁")+'</div>'+
      '<div class="row" style="margin:16px 0;gap:26px;"><div><div class="big-num" style="font-size:52px;">'+first+'/'+Q.length+'</div><div class="muted">First try</div></div>'+
      '<div><div class="big-num" style="font-size:52px;">'+acc+'%</div><div class="muted">Score</div></div></div>'+
      '<p style="font-size:30px;">'+"⭐".repeat(rt.stars)+"▫️".repeat(5-rt.stars)+'</p><p class="muted" id="saveState">💾 Saving…</p>'+
      '<div class="row">'+(level===1?'<button class="btn big green" id="up">⭐⭐ Try Level 2</button>':'')+'<button class="btn green" id="again">🔁 Play again</button><button class="btn blue" id="menu">⏪ Undo Button home</button></div></div>';
    var up=el("up"); if(up) up.onclick=function(){ MQ.sound("level"); practice(2); };
    el("again").onclick=function(){ MQ.sound("click"); practice(level); };
    el("menu").onclick=function(){ MQ.sound("click"); menu(); };
    MQ.logResult({ student:student||"Unknown", subject:"Maths", week:"", weekTitle:"Inverse of + and − (Year 3) — Practice Level "+level,
      accuracy:acc, correct:first, totalQuestions:Q.length, stars:rt.stars, rating:rt.label,
      school:(window.MATHQUEST_CONFIG&&window.MATHQUEST_CONFIG.ACADEMY_NAME)||"Whyte Pyramid Academy",
      tutor:(window.MATHQUEST_CONFIG&&window.MATHQUEST_CONFIG.TUTOR_NAME)||"" })
    .then(function(res){ var s=el("saveState"); if(!s) return;
      s.textContent = res&&res.ok ? "✅ Saved — your tutor can see your score!" : res&&res.offline ? "📴 Saved on this device." : "⚠️ Couldn't reach the server, but it's saved on this device."; });
  }
  show();
}
