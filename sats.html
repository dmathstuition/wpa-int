/* ---------- small helpers ---------- */
function el(id){ return document.getElementById(id); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function commas(n){ return Number(n).toLocaleString("en-GB"); }
var screen=el("screen");

/* vertical column layouts (self-contained, reuse .colsum styles) */
function verticalSum(nums){
  var strs=nums.map(String), width=Math.max.apply(null,strs.map(function(s){return s.length;}));
  var rows=strs.map(function(s,idx){
    var padded=s.padStart(width," ").split("");
    var op=idx>0?'<td class="op">+</td>':'<td></td>';
    return '<tr>'+op+padded.map(function(d){return '<td>'+(d===" "?"":d)+'</td>';}).join("")+'</tr>';
  }).join("");
  var line='<td></td>'+Array(width).fill('<td></td>').join("");
  return '<div class="colsum"><table>'+rows+'<tr class="line">'+line+'</tr></table></div>';
}
function verticalSub(M,S){
  var Ms=String(M),Ss=String(S),width=Math.max(Ms.length,Ss.length);
  function row(str,op){ var p=str.padStart(width," ").split("");
    return '<tr>'+(op?'<td class="op">−</td>':'<td></td>')+p.map(function(d){return '<td>'+(d===" "?"":d)+'</td>';}).join("")+'</tr>'; }
  var line='<td></td>'+Array(width).fill('<td></td>').join("");
  return '<div class="colsum"><table>'+row(Ms,false)+row(Ss,true)+'<tr class="line">'+line+'</tr></table></div>';
}
function qBody(q){
  if(q.col){ return '<div class="demo-wrap">'+(q.col.op==="add"?verticalSum(q.col.nums):verticalSub(q.col.M,q.col.S))+'</div>'; }
  return '<div class="qbox">'+q.q+'</div>';
}
function answerLabel(q){ return q.k==="mc" ? q.options[q.a] : commas(q.a); }
function qTitle(q){
  if(!q.col) return q.q.replace(/<br>/g," ");
  if(q.col.op==="add") return q.col.nums.map(commas).join(" + ");
  return commas(q.col.M)+" − "+commas(q.col.S);
}

/* =============================================================
   PRACTICE MODE — one at a time, instant feedback + solutions
   ============================================================= */
function startPractice(){
  var Q=shuffle(BANK), i=0, correct=0, answered=0, firstTry=true;
  function shell(body){
    var pct=Math.round(i/Q.length*100);
    screen.innerHTML=
      '<div class="card">'+
        '<div class="row" style="justify-content:space-between;">'+
          '<span class="qnum">📚 Practice</span>'+
          '<span class="chip" style="background:#eee;color:#333;">Q '+(i+1)+' / '+Q.length+'</span>'+
        '</div>'+
        '<div class="xpbar" style="background:#eee;margin:12px 0 6px;"><i style="width:'+pct+'%;"></i></div>'+
        body+
        '<div class="feedback" id="fb"></div>'+
        '<div class="center" id="controls"></div>'+
      '</div>';
  }
  function next(){
    el("controls").innerHTML='<button class="btn big green" id="nx">'+(i+1>=Q.length?"See results ▶":"Next ▶")+'</button>';
    el("nx").focus();
    el("nx").onclick=function(){ MQ.sound("click"); i++; if(i>=Q.length) done(); else show(); };
  }
  function reveal(ok,q){
    var fb=el("fb");
    fb.className="feedback "+(ok?"good":"bad");
    fb.innerHTML=(ok?"🎉 Correct!":"❌ Not quite — the answer is <b>"+answerLabel(q)+"</b>")+
      '<div class="solbox">💡 '+q.sol+'</div>';
  }
  function show(){
    firstTry=true;
    var q=Q[i];
    if(q.k==="mc"){
      shell(qBody(q)+'<div class="options" id="opts">'+q.options.map(function(o,ix){return '<button class="opt" data-i="'+ix+'">'+o+'</button>';}).join("")+'</div>');
      el("controls").innerHTML='<button class="btn ghost" id="hintBtn">💡 Hint</button>';
      el("hintBtn").onclick=function(){ var f=el("fb"); f.className="feedback"; f.textContent="💡 "+q.hint; };
      Array.prototype.forEach.call(document.querySelectorAll("#opts .opt"),function(b){
        b.onclick=function(){
          var ix=Number(b.getAttribute("data-i"));
          if(ix===q.a){ b.classList.add("correct"); document.querySelectorAll("#opts .opt").forEach(function(x){x.disabled=true;});
            if(firstTry){correct++;} answered++; MQ.sound("correct"); MQ.confetti(60); reveal(true,q); next();
          } else { b.classList.add("wrong"); b.disabled=true; firstTry=false; MQ.sound("wrong");
            var f=el("fb"); f.className="feedback bad"; f.innerHTML="Not quite — try another. 💡"; }
        };
      });
      return;
    }
    // input
    shell(qBody(q)+'<div class="center" style="margin-top:12px;"><input class="answer-input" id="ans" inputmode="numeric" autocomplete="off" placeholder="= ?"></div>');
    el("controls").innerHTML='<button class="btn green" id="checkBtn">Check ✅</button> <button class="btn ghost" id="hintBtn">💡 Hint</button>';
    var inp=el("ans"); inp.focus();
    el("hintBtn").onclick=function(){ var f=el("fb"); f.className="feedback"; f.textContent="💡 "+q.hint; };
    el("checkBtn").onclick=function(){
      var v=Number(String(inp.value).replace(/[,\s]/g,""));
      if(inp.value===""||isNaN(v)){ var f=el("fb"); f.className="feedback"; f.textContent="Type a number first ✏️"; return; }
      if(v===q.a){ inp.disabled=true; if(firstTry){correct++;} answered++; MQ.sound("correct"); MQ.confetti(60); reveal(true,q); next(); }
      else { firstTry=false; MQ.sound("wrong"); var f=el("fb"); f.className="feedback bad"; f.innerHTML="Not quite — have another go. 💡 "+q.hint; inp.value=""; inp.focus(); }
    };
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter") el("checkBtn").click(); });
  }
  function done(){
    var acc=answered?Math.round(correct/answered*100):0, rt=MQ.rating(acc);
    MQ.sound("win"); MQ.confetti(180);
    screen.innerHTML=
      '<div class="card center">'+
        '<div class="mascot" style="font-size:76px;">'+rt.emoji+'</div>'+
        '<h1>Practice complete!</h1>'+
        '<div class="speech">Well done, '+(student||"star")+'! You practised '+Q.length+' SAT questions.</div>'+
        '<div class="row" style="margin:18px 0;gap:26px;"><div><div class="big-num" style="font-size:52px;">'+acc+'%</div><div class="muted">Accuracy</div></div>'+
        '<div><div class="big-num" style="font-size:52px;">'+correct+'/'+Q.length+'</div><div class="muted">First-try correct</div></div></div>'+
        '<p style="font-size:30px;font-weight:800;">'+"⭐".repeat(rt.stars)+"▫️".repeat(5-rt.stars)+'</p>'+
        '<div class="row" style="margin-top:8px;"><button class="btn green" id="again">🔁 Practise again</button>'+
        '<button class="btn blue" id="toCbt">🖥️ Try the 30-min test</button>'+
        '<button class="btn ghost" id="toMenu">🏠 SATs menu</button></div>'+
      '</div>';
    el("again").onclick=function(){ MQ.sound("click"); startPractice(); };
    el("toCbt").onclick=function(){ MQ.sound("click"); cbtIntro(); };
    el("toMenu").onclick=function(){ MQ.sound("click"); menu(); };
  }
  show();
}

      '<div class="speech">This is a real exam-style test, '+(student||"explorer")+'.</div>'+
      '<ul style="text-align:left;max-width:480px;margin:16px auto;font-weight:700;color:#4a4470;">'+
        '<li>⏱️ <b>30 minutes</b> · <b>'+CBT_COUNT+' questions</b> on addition &amp; subtraction.</li>'+
        '<li>Move with <b>Next</b> / <b>Back</b>, or tap a number to jump.</li>'+
        '<li>Not sure? <b>🚩 Flag</b> a question and come back to it.</li>'+
        '<li>No feedback during the test — you get a <b>full marked report</b> at the end.</li>'+
        '<li>The test <b>submits automatically</b> when the timer reaches 0.</li>'+
      '</ul>'+
      '<div class="row"><button class="btn big blue" id="go">🖥️ Begin the 30-minute test</button>'+
      '<button class="btn ghost" id="back">← Back</button></div>'+
    '</div>';
  el("go").onclick=function(){ MQ.sound("level"); runCBT(); };
  el("back").onclick=function(){ MQ.sound("click"); menu(); };
}

function runCBT(){
  var Q=shuffle(BANK).slice(0,CBT_COUNT);
  var ans=Q.map(function(){ return null; });   // number or option-index
  var flag=Q.map(function(){ return false; });
  var cur=0, startTime=Date.now(), endAt=startTime+CBT_MINUTES*60*1000, timer=null, finished=false;

  function paintTimer(){
    var left=Math.max(0,Math.round((endAt-Date.now())/1000));
    var m=Math.floor(left/60), s=left%60;
    var t=el("cbtTime"); if(t){ t.textContent="⏱ "+m+":"+String(s).padStart(2,"0"); t.classList.toggle("warn",left<=120); }
    return left;
  }
  function tick(){ var left=paintTimer(); if(left<=0){ clearInterval(timer); submit(true); } }

  function answeredCount(){ return ans.filter(function(x){ return x!==null && x!==""; }).length; }

  function render(){
    var q=Q[cur];
    var pal="";
    for(var p=0;p<Q.length;p++){
      var done=(ans[p]!==null && ans[p]!=="");
      pal+='<button class="pal'+(done?" done":"")+(p===cur?" cur":"")+(flag[p]?" flag":"")+'" data-p="'+p+'">'+(p+1)+'</button>';
    }
    var body;
    if(q.k==="mc"){
      body=qBody(q)+'<div class="options" id="opts">'+q.options.map(function(o,ix){
        return '<button class="opt'+(ans[cur]===ix?" correct":"")+'" data-i="'+ix+'">'+o+'</button>'; }).join("")+'</div>';
    } else {
      var cv=(ans[cur]===null?"":ans[cur]);
      body=qBody(q)+'<div class="center" style="margin-top:12px;"><input class="answer-input" id="ans" inputmode="numeric" autocomplete="off" placeholder="= ?" value="'+cv+'"></div>';
    }
    screen.innerHTML=
      '<div class="cbt-bar">'+
        '<span class="t" id="cbtTime">⏱ 30:00</span>'+
        '<span class="meta">Question '+(cur+1)+' of '+Q.length+'</span>'+
        '<span class="meta">Answered '+answeredCount()+' / '+Q.length+'</span>'+
      '</div>'+
      '<div class="card">'+
        '<div class="row" style="justify-content:space-between;">'+
          '<span class="qnum" style="background:'+(q.t==="sub"?"#ff5b6b":q.t==="add"?"#2bd576":"#9b5cff")+';">'+(q.t==="add"?"➕ Addition":q.t==="sub"?"➖ Subtraction":"🔀 Multi-step")+'</span>'+
          '<button class="btn ghost flagbtn'+(flag[cur]?" on":"")+'" id="flagBtn">'+(flag[cur]?"🚩 Flagged":"🚩 Flag")+'</button>'+
        '</div>'+
        body+
        '<div class="row" style="margin-top:16px;justify-content:space-between;">'+
          '<button class="btn ghost" id="prev"'+(cur===0?" disabled":"")+'>← Back</button>'+
          (cur+1>=Q.length
            ? '<button class="btn big green" id="submit">✅ Submit test</button>'
            : '<button class="btn big blue" id="nextq">Next →</button>')+
        '</div>'+
        '<div class="palette">'+pal+'</div>'+
        '<div class="center"><button class="btn ghost" id="endEarly">🏁 Finish &amp; submit now</button></div>'+
      '</div>';
    paintTimer();

    // wire input / options
    if(q.k==="mc"){
      Array.prototype.forEach.call(document.querySelectorAll("#opts .opt"),function(b){
        b.onclick=function(){ ans[cur]=Number(b.getAttribute("data-i")); MQ.sound("click");
          document.querySelectorAll("#opts .opt").forEach(function(x){x.classList.remove("correct");}); b.classList.add("correct"); syncPalette(); };
      });
    } else {
      var inp=el("ans");
      inp.oninput=function(){ var raw=String(inp.value).replace(/[,\s]/g,""); ans[cur]=(raw===""?"":(isNaN(Number(raw))?"":Number(raw))); syncPalette(); };
      inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ if(cur+1<Q.length){ go(cur+1); } else { el("submit").focus(); } } });
      inp.focus();
    }
    el("flagBtn").onclick=function(){ flag[cur]=!flag[cur]; MQ.sound("click"); render(); };
    var pv=el("prev"); if(pv) pv.onclick=function(){ if(cur>0) go(cur-1); };
    var nq=el("nextq"); if(nq) nq.onclick=function(){ go(cur+1); };
    var sb=el("submit"); if(sb) sb.onclick=function(){ confirmSubmit(); };
    el("endEarly").onclick=function(){ confirmSubmit(); };
    Array.prototype.forEach.call(document.querySelectorAll(".pal"),function(b){
      b.onclick=function(){ go(Number(b.getAttribute("data-p"))); };
    });
  }
  function syncPalette(){
    // lightweight update of the current palette tile + counters without full re-render
    var meta=document.querySelectorAll(".cbt-bar .meta")[1]; if(meta) meta.textContent="Answered "+answeredCount()+" / "+Q.length;
    var tile=document.querySelector('.pal[data-p="'+cur+'"]');
    if(tile){ var done=(ans[cur]!==null && ans[cur]!==""); tile.classList.toggle("done",done); }
  }
  function go(p){ if(p<0||p>=Q.length) return; cur=p; MQ.sound("click"); render(); }

  function confirmSubmit(){
    var unanswered=ans.filter(function(x){ return x===null||x===""; }).length;
    var flagged=flag.filter(Boolean).length;
    var msg="Submit your test now?";
    var extra=[];
    if(unanswered) extra.push(unanswered+" not answered");
    if(flagged) extra.push(flagged+" flagged");
    if(extra.length) msg+="\n\nYou still have "+extra.join(" and ")+".";
    if(window.confirm(msg)) submit(false);
  }

  function submit(timedOut){
    if(finished) return; finished=true;
    if(timer) clearInterval(timer);
    var correct=0, answered=0;
    var review=Q.map(function(q,ix){
      var given=ans[ix];
      var didAnswer=(given!==null && given!=="");
      var isRight = q.k==="mc" ? (given===q.a) : (Number(given)===q.a);
      if(didAnswer) answered++;
      if(isRight) correct++;
      return { q:q, given:given, didAnswer:didAnswer, right:isRight };
    });
    var acc=Math.round(correct/Q.length*100);   // marked out of the whole paper
    var rt=MQ.rating(acc);
    var used=Math.max(1,Math.round((Date.now()-startTime)/60000));
    MQ.sound("win"); MQ.confetti(220);

    var reviewHtml=review.map(function(r,ix){
      var q=r.q;
      var yours = !r.didAnswer ? '<span style="color:#b23">— (blank)</span>'
                 : (q.k==="mc" ? q.options[r.given] : commas(r.given));
      return '<div class="rev-item '+(r.right?"ok":"no")+'">'+
        '<span class="rev-badge">'+(r.right?"✅":"❌")+'</span>'+
        '<div style="font-weight:800;margin-bottom:4px;">Q'+(ix+1)+'. '+qTitle(q)+'</div>'+
        '<div class="ya">Your answer: '+yours+'</div>'+
        (r.right?'':'<div class="ya" style="color:#0a8a3f;">Correct answer: '+answerLabel(q)+'</div>')+
        '<div class="solbox">💡 '+q.sol+'</div>'+
      '</div>';
    }).join("");

    screen.innerHTML=
      '<div class="card center">'+
        '<div class="mascot" style="font-size:78px;">'+rt.emoji+'</div>'+
        '<h1>'+(timedOut?"⏰ Time\'s up — test submitted":"Test submitted!")+'</h1>'+
        '<div class="speech">Here is your marked SATs report, '+(student||"explorer")+'.</div>'+
        '<div class="row" style="margin:18px 0;gap:22px;">'+
          '<div><div class="big-num" style="font-size:54px;">'+correct+'/'+Q.length+'</div><div class="muted">Score</div></div>'+
          '<div><div class="big-num" style="font-size:54px;">'+acc+'%</div><div class="muted">Marks</div></div>'+
          '<div><div class="big-num" style="font-size:54px;">'+used+'</div><div class="muted">Minutes used</div></div>'+
        '</div>'+
        '<p style="font-size:30px;font-weight:800;">'+"⭐".repeat(rt.stars)+"▫️".repeat(5-rt.stars)+'</p>'+
        '<p style="font-size:20px;font-weight:800;color:var(--purple);">Rating: '+rt.label+'</p>'+
        '<p class="muted" id="saveState">💾 Saving your result…</p>'+
        '<div class="row" style="margin-top:6px;"><button class="btn green" id="retry">🔁 New test</button>'+
        '<button class="btn ghost" id="toMenu">🏠 SATs menu</button></div>'+
      '</div>'+
      '<div class="card"><h2>📋 Question-by-question review</h2>'+reviewHtml+'</div>';
    el("retry").onclick=function(){ MQ.sound("click"); cbtIntro(); };
    el("toMenu").onclick=function(){ MQ.sound("click"); menu(); };

    MQ.logResult({
      student: student||"Unknown", subject:"Maths SATs", mode:"CBT",
      week:"", weekTitle:"SATs CBT — Addition & Subtraction",
      accuracy:acc, correct:correct, answered:answered, totalQuestions:Q.length,
      stars:rt.stars, rating:rt.label, minutes:used, timedOut:!!timedOut,
      school:(window.MATHQUEST_CONFIG&&window.MATHQUEST_CONFIG.ACADEMY_NAME)||"Whyte Pyramid Academy",
      tutor:(window.MATHQUEST_CONFIG&&window.MATHQUEST_CONFIG.TUTOR_NAME)||""
    }).then(function(res){
      var s=el("saveState"); if(!s) return;
      if(res&&res.ok) s.textContent="✅ Test saved — your tutor can see your report!";
      else if(res&&res.offline) s.textContent="📴 Saved on this device (tutor: add the Apps Script link to sync).";
      else s.textContent="⚠️ Couldn't reach the server, but your result is saved on this device.";
    });
  }

  render();
  timer=setInterval(tick,1000);
}

home();
</script>
</body>
</html>
