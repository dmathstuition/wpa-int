/* ---------- helpers ---------- */
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function plain(s){ return String(s||"").replace(/<span class='sent'>/g," ").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim(); }
function norm(s){ return String(s==null?"":s).toLowerCase().replace(/[’']/g,"'").trim().replace(/[.!?,;:"]+$/,"").replace(/\s+/g," "); }
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffleR(a,r){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var screen=el("screen");

/* Build the paper from a seed: grammar and spelling questions are shuffled,
   comprehension stays in story order; MC options are shuffled. Same seed → same paper (resume). */
function buildPaper(seed){
  var r=mulberry(seed), paper=[];
  SECTIONS.forEach(function(S){
    var qs=BANK.filter(function(q){return q.sec===S.id;});
    if(S.id!=="reading") qs=shuffleR(qs,r);
    qs.forEach(function(q){
      var it={ src:q, sec:q.sec, skill:q.skill, kind:q.k, why:q.why };
      if(q.k==="mc"){ it.q=q.q; it.options=shuffleR(q.o,r); it.answer=it.options.indexOf(q.o[0]); }
      else if(q.k==="input"){ it.q=q.q; it.accept=q.a; }
      else { it.sentence=q.sentence; it.say=q.say; it.hint=q.hint; it.accept=q.a; }
      paper.push(it);
    });
  });
  return paper;
}
function isRight(it, given){
  if(given==null || given==="") return false;
  if(it.kind==="mc") return given===it.answer;
  var g=norm(given); return it.accept.some(function(a){ return norm(a)===g; });
}
function answerText(it, given){
  if(given==null || given==="") return "(blank)";
  return it.kind==="mc" ? it.options[given] : String(given);
}
function correctText(it){ return it.kind==="mc" ? it.options[it.answer] : it.accept[0]; }
function questionText(it){
  if(it.kind==="spell") return "Spelling: "+it.sentence+" ("+it.hint+")";
  return plain(it.q);
}
function secTitle(id){ for(var i=0;i<SECTIONS.length;i++) if(SECTIONS[i].id===id) return SECTIONS[i].title; return id; }

/* ---------- speech for the spelling section ---------- */
var canSpeak = ("speechSynthesis" in window);
function say(text, rate){
  try{
    if(!canSpeak) return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text); u.rate=rate||0.85; u.lang="en-GB";
    var vs=window.speechSynthesis.getVoices()||[];
    var v=vs.find(function(x){return /en[-_]GB/i.test(x.lang);})||vs.find(function(x){return /^en/i.test(x.lang);});
    if(v) u.voice=v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
try{ if(canSpeak){ window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged=function(){ window.speechSynthesis.getVoices(); }; } }catch(e){}
function dictate(it, slow){ var w=it.accept[0]; say(w+". "+it.say+" "+w+".", slow?0.6:0.85); }

/* =============================================================
   TEST RUNNER
   ============================================================= */
var timer=null, keyH=null;
function runTest(att){
  var P=buildPaper(att.seed), N=P.length, finished=false, firstPaint=true, warned10=false, warned5=false;
  function save(){ MQ.saveLocal(attemptKey(), att); }
  function answered(i){ return att.ans[i]!=null && att.ans[i]!==""; }
  function nAnswered(){ var c=0; for(var i=0;i<N;i++) if(answered(i)) c++; return c; }
  function secOf(i){ for(var s=0;s<SECTIONS.length;s++) if(SECTIONS[s].id===P[i].sec) return SECTIONS[s]; }

  function paintTimer(){
    var left=Math.max(0,Math.round((att.endAt-Date.now())/1000)), m=Math.floor(left/60), s=left%60, t=el("tm");
    if(t){ t.textContent="⏱ "+m+":"+String(s).padStart(2,"0"); t.classList.toggle("warn", left<=300); }
    if(left<=600 && left>0 && !warned10){ warned10=true; toast("⏰ 10 minutes left"); }
    if(left<=300 && left>0 && !warned5){ warned5=true; toast("⏰ 5 minutes left. Check for any blank questions!"); }
    return left;
  }
  function syncCounts(){
    var c=el("cnt"); if(c) c.textContent="Answered "+nAnswered()+" / "+N;
    var tile=document.querySelector('.pal[data-p="'+att.cur+'"]'); if(tile) tile.classList.toggle("done", answered(att.cur));
  }

  function render(arrived){
    var i=att.cur, q=P[i], S=secOf(i), body="";
    if(q.sec==="reading"){
      body+='<details open class="passwrap"><summary style="font-weight:800;cursor:pointer;color:#1e3a5f;margin-bottom:6px;">📖 '+PASSAGE_TITLE+' (tap to hide or show)</summary>'+
        '<div class="passage"><h3>'+PASSAGE_TITLE+'</h3>'+PASSAGE.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join("")+'</div></details>';
    }
    if(q.kind==="mc"){
      body+='<div class="qtext">'+q.q+'</div><div class="options col1" id="opts">'+q.options.map(function(o,k){
        return '<button class="opt'+(att.ans[i]===k?" picked":"")+'" data-k="'+k+'"><b>'+"ABCD"[k]+'.</b> '+esc(o)+'</button>'; }).join("")+'</div>';
    } else if(q.kind==="input"){
      body+='<div class="qtext">'+q.q+'</div><div class="center"><input class="typein" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="30" placeholder="Type your answer" value="'+esc(att.ans[i]||"")+'"></div>';
    } else {
      body+='<div class="spellbox"><div class="qtext">Listen, then type the missing word.<span class="sent" style="font-size:22px;">'+esc(q.sentence)+'</span></div>'+
        '<div class="row" style="justify-content:center;gap:10px;"><button class="btn blue" id="hear">🔊 Hear it</button><button class="btn ghost" id="slow">🐢 Slower</button></div>'+
        '<div class="hint">💡 '+esc(q.hint)+'</div>'+
        '<div style="margin-top:12px;"><input class="typein" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" autocorrect="off" maxlength="30" placeholder="Type the word" value="'+esc(att.ans[i]||"")+'"></div>'+
        (canSpeak?'':'<p class="mailbox bad" style="margin-top:10px;">🔇 Ask your tutor to read the word aloud.</p>')+'</div>';
    }
    var pal="", last=null;
    for(var p=0;p<N;p++){
      if(P[p].sec!==last){ last=P[p].sec; var SS=secOf(p); pal+='<span class="pal sep">'+SS.n+' · '+SS.title+'</span>'; }
      pal+='<button class="pal'+(answered(p)?" done":"")+(p===i?" cur":"")+(att.flag[p]?" flag":"")+'" data-p="'+p+'">'+(p+1)+'</button>';
    }
    screen.innerHTML=
      '<div class="cbt-bar"><span class="t" id="tm">⏱</span><span class="meta">Question '+(i+1)+' of '+N+'</span><span class="meta" id="cnt">Answered '+nAnswered()+' / '+N+'</span></div>'+
      '<div class="card'+(firstPaint?"":" still")+'">'+
        '<div class="secband">'+S.n+' · '+S.title+'<small>'+S.desc+'</small></div>'+
        '<div class="row" style="justify-content:space-between;"><span class="qno">Q'+(i+1)+'</span>'+
          '<button class="btn ghost flagbtn'+(att.flag[i]?" on":"")+'" id="fl">'+(att.flag[i]?"🚩 Flagged":"🚩 Flag for review")+'</button></div>'+
        body+
        '<div class="row" style="margin-top:16px;justify-content:space-between;">'+
          '<button class="btn ghost" id="bk"'+(i===0?" disabled":"")+'>← Back</button>'+
          (i+1>=N?'<button class="btn big green" id="sub">✅ Submit test</button>':'<button class="btn big blue" id="nx">Next →</button>')+'</div>'+
        '<div class="palette">'+pal+'</div>'+
        '<div class="center"><button class="btn ghost" id="fin">🏁 Finish &amp; submit now</button></div>'+
      '</div>';
    firstPaint=false; paintTimer();
    if(q.kind==="mc"){
      Array.prototype.forEach.call(document.querySelectorAll("#opts .opt"),function(b){
        b.onclick=function(){ att.ans[i]=Number(b.getAttribute("data-k")); save(); MQ.sound("click");
          document.querySelectorAll("#opts .opt").forEach(function(x){ x.classList.remove("picked"); }); b.classList.add("picked"); syncCounts(); };
      });
    } else {
      var tin=el("tin");
      tin.addEventListener("input",function(){ att.ans[i]=tin.value; save(); syncCounts(); });
      tin.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); if(i+1<N) go(i+1); } });
      if(q.kind==="spell"){
        el("hear").onclick=function(){ dictate(q,false); tin.focus(); };
        el("slow").onclick=function(){ dictate(q,true); tin.focus(); };
        if(arrived && MQ.soundEnabled()) setTimeout(function(){ dictate(q,false); },350);
      }
      if(window.innerWidth>700) tin.focus();
    }
    el("fl").onclick=function(){ att.flag[i]=!att.flag[i]; if(!att.flag[i]) delete att.flag[i]; save(); MQ.sound("click"); render(false); };
    var bk=el("bk"); if(bk) bk.onclick=function(){ go(i-1); };
    var nx=el("nx"); if(nx) nx.onclick=function(){ go(i+1); };
    var sb=el("sub"); if(sb) sb.onclick=confirmSubmit;
    el("fin").onclick=confirmSubmit;
    Array.prototype.forEach.call(document.querySelectorAll(".pal[data-p]"),function(b){ b.onclick=function(){ go(Number(b.getAttribute("data-p"))); }; });
  }
  function go(p){ if(p<0||p>=N) return; try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} att.cur=p; save(); MQ.sound("click"); render(true); window.scrollTo({top:0,behavior:"smooth"}); }
  function confirmSubmit(){
    var blank=N-nAnswered(), fl=Object.keys(att.flag).length, extra=[];
    if(blank) extra.push(blank+" unanswered"); if(fl) extra.push(fl+" flagged");
    if(confirm("Submit your test now?"+(extra.length?"\n\nYou still have "+extra.join(" and ")+" question"+(blank+fl===1?"":"s")+".":""))) submit(false);
  }
  function submit(timedOut){
    if(finished) return; finished=true;
    clearInterval(timer); timer=null;
    if(keyH){ document.removeEventListener("keydown",keyH); keyH=null; }
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    att.done=true; att.timedOut=!!timedOut; att.finishedAt=Math.min(Date.now(),att.endAt); save();
    showResults(buildReport(P, att));
  }
  keyH=function(e){ if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key==="ArrowRight") go(att.cur+1); else if(e.key==="ArrowLeft") go(att.cur-1); };
  document.addEventListener("keydown",keyH);
  if(timer) clearInterval(timer);
  if(paintTimer()<=0){ submit(true); return; }
  render(true);
  timer=setInterval(function(){ if(paintTimer()<=0) submit(true); },1000);
}

function toast(msg){
  var t=document.createElement("div"); t.textContent=msg;
  t.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f2a4a;color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;font-size:16px;z-index:500;box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:92vw;text-align:center;";
  document.body.appendChild(t); setTimeout(function(){ t.style.transition="opacity .4s"; t.style.opacity="0"; setTimeout(function(){t.remove();},400); },2600);
}

/* =============================================================
   PERFORMANCE ANALYSIS (one report object used for the screen,
   the download, the PDF/print copy and the tutor's email)
   ============================================================= */
function bandFor(pct){
  if(pct>=80) return { label:"Greater depth", note:"Excellent work, well above the expected standard for Year 6.", col:"#16a34a" };
  if(pct>=60) return { label:"Expected standard", note:"Secure. Working at the expected standard for Year 6, with a few areas to polish.", col:"#2563eb" };
  if(pct>=40) return { label:"Working towards", note:"Developing. Some areas are secure; the targets below will help close the gaps.", col:"#d97706" };
  return { label:"Needs more support", note:"Early stages. Focused practice on the targets below will make a big difference.", col:"#dc2626" };
}
function buildReport(P, att){
  var N=P.length, score=0, answeredN=0, sec={}, sk={}, corrections=[], all=[];
  SECTIONS.forEach(function(S){ sec[S.id]={c:0,n:0}; });
  SKILLS.forEach(function(s){ sk[s]={c:0,n:0}; });
  P.forEach(function(it,i){
    var given=att.ans[i], ok=isRight(it,given), blank=(given==null||given==="");
    if(!blank) answeredN++;
    if(ok) score++;
    sec[it.sec].n++; if(ok) sec[it.sec].c++;
    sk[it.skill].n++; if(ok) sk[it.skill].c++;
    var row={ no:i+1, section:secTitle(it.sec), skill:it.skill, q:questionText(it), your:answerText(it,given), correct:correctText(it), why:plain(it.why), ok:ok, blank:blank };
    all.push(row); if(!ok) corrections.push(row);
  });
  var pct=Math.round(score/N*100), band=bandFor(pct);
  var minutes=Math.max(1,Math.round((att.finishedAt-att.start)/60000));
  var sections=SECTIONS.map(function(S){ var v=sec[S.id]; return { name:S.title, c:v.c, n:v.n, pct:v.n?Math.round(v.c/v.n*100):0 }; });
  var skills=SKILLS.map(function(s){ var v=sk[s]; return { name:s, section:secTitle(SKILL_SECTION[s]), c:v.c, n:v.n, pct:v.n?Math.round(v.c/v.n*100):0 }; });
  var strengths=skills.filter(function(s){ return s.pct>=80; }).map(function(s){ return s.name+" ("+s.c+"/"+s.n+")"; });
  var targets=skills.filter(function(s){ return s.pct<60; }).sort(function(a,b){ return a.pct-b.pct; })
    .map(function(s){ return { skill:s.name, score:s.c+"/"+s.n, advice:ADVICE[s.name] }; });
  var bestSec=sections.slice().sort(function(a,b){ return b.pct-a.pct; })[0], weakSec=sections.slice().sort(function(a,b){ return a.pct-b.pct; })[0];
  var who=student||"The learner";
  var summary=who+" scored "+score+" out of "+N+" ("+pct+"%) in "+minutes+" minute"+(minutes===1?"":"s")+(att.timedOut?" (the time ran out)":"")+
    ", answering "+answeredN+" of "+N+" questions. Strongest section: "+bestSec.name+" ("+bestSec.c+"/"+bestSec.n+")."+
    (weakSec.pct<bestSec.pct?" Section needing the most practice: "+weakSec.name+" ("+weakSec.c+"/"+weakSec.n+").":" All sections were equally strong.");
  return { test:TEST_TITLE, student:who, school:ACADEMY, tutor:TUTOR, date:new Date().toISOString(),
    dateText:new Date().toLocaleString("en-GB",{ weekday:"short", day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" }),
    minutes:minutes, timedOut:!!att.timedOut, score:score, total:N, pct:pct, answered:answeredN,
    band:band.label, bandNote:band.note, bandCol:band.col, summary:summary,
    sections:sections, skills:skills, strengths:strengths, targets:targets, corrections:corrections, all:all };
}

    '<h2>Summary</h2><p>'+esc(R.summary)+'</p>'+
    '<h2>Section results</h2><table><tr><th>Section</th><th>Score</th><th style="width:45%">Performance</th></tr>'+
      R.sections.map(function(s){ return '<tr><td>'+esc(s.name)+'</td><td>'+s.c+' / '+s.n+' ('+s.pct+'%)</td><td>'+bar(s.pct,col(s.pct))+'</td></tr>'; }).join("")+'</table>'+
    '<h2>Skills analysis</h2><table><tr><th>Skill</th><th>Section</th><th>Score</th><th style="width:35%">Performance</th></tr>'+
      R.skills.map(function(s){ return '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.section)+'</td><td>'+s.c+' / '+s.n+'</td><td>'+bar(s.pct,col(s.pct))+'</td></tr>'; }).join("")+'</table>'+
    '<h2>Strengths</h2>'+(R.strengths.length?R.strengths.map(function(s){ return '<div class="str">✅ '+esc(s)+'</div>'; }).join(""):'<p>Keep practising. Strengths will show here as scores reach 80% in a skill.</p>')+
    '<h2>Targets and next steps</h2>'+(R.targets.length?R.targets.map(function(t){ return '<div class="tgt"><b>🎯 '+esc(t.skill)+' ('+esc(t.score)+')</b><br>'+esc(t.advice)+'</div>'; }).join(""):'<p>No skill scored below 60%. Well done! Keep revising to stay sharp.</p>')+
    '<h2>Corrections ('+R.corrections.length+')</h2>'+
    (R.corrections.length?'<table><tr><th>Q</th><th>Question</th><th>Your answer</th><th>Correct answer</th><th>Why</th></tr>'+
      R.corrections.map(function(c){ return '<tr><td>'+c.no+'</td><td><small>'+esc(c.section)+' · '+esc(c.skill)+'</small><br>'+esc(c.q)+'</td><td class="x">'+esc(c.your)+'</td><td class="ok">'+esc(c.correct)+'</td><td>'+esc(c.why)+'</td></tr>'; }).join("")+'</table>'
      :'<p>🎉 No corrections. Every question was answered correctly!</p>')+
    '<h2>All answers</h2><table><tr><th>Q</th><th>Section</th><th>Your answer</th><th>Result</th></tr>'+
      R.all.map(function(a){ return '<tr><td>'+a.no+'</td><td>'+esc(a.section)+'</td><td>'+esc(a.your)+'</td><td>'+(a.ok?'<span class="ok">✔ Correct</span>':'<span class="x">✘ Correct answer: '+esc(a.correct)+'</span>')+'</td></tr>'; }).join("")+'</table>'+
    '<p class="foot">Generated by '+esc(R.school)+' learning portal.</p>'+
    '</main>'+(forPrint?'<script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script>':'')+'</body></html>';
  return h;
}
function fileBase(R){ return ("English-Test-Report_"+R.student+"_"+R.date.slice(0,10)).replace(/[^\w\-]+/g,"_"); }
function downloadReport(R){
  var blob=new Blob([reportDoc(R,false)],{type:"text/html"}), url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=fileBase(R)+".html"; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1500);
}
function printReport(R){
  var w=window.open("","_blank");
  if(!w){ toast("Please allow pop-ups to save the PDF, or use Download instead."); return; }
  w.document.open(); w.document.write(reportDoc(R,true)); w.document.close();
}

/* ---------- email to tutor (via the academy's Apps Script) ---------- */
function emailPayload(R){
  return { type:"report", test:R.test, student:R.student, school:R.school, tutor:R.tutor, date:R.date, dateText:R.dateText,
    minutes:R.minutes, timedOut:R.timedOut, score:R.score, total:R.total, pct:R.pct, answered:R.answered,
    band:R.band, bandNote:R.bandNote, summary:R.summary, sections:R.sections, skills:R.skills,
    strengths:R.strengths, targets:R.targets, corrections:R.corrections };
}
function sendToTutor(R){
  var box=el("mailbox"); if(box){ box.className="mailbox wait"; box.textContent="📧 Sending the report to your tutor…"; }
  return MQ.sendReport(emailPayload(R)).then(function(res){
    var b=el("mailbox"); if(!b) return;
    if(res&&res.ok){ b.className="mailbox ok"; b.innerHTML="📧 Report sent to your tutor's email ✅"; var a=MQ.readLocal(attemptKey()); if(a){ a.emailed=true; MQ.saveLocal(attemptKey(),a); } }
    else if(res&&res.offline){ b.className="mailbox bad"; b.innerHTML="📴 The report could not be emailed (the portal is offline). Please download it and send it to your tutor."; }
    else { b.className="mailbox bad"; b.innerHTML='⚠️ The report could not be sent. Check the internet connection. <button class="btn ghost" id="resend">🔁 Try again</button>'; var r=el("resend"); if(r) r.onclick=function(){ sendToTutor(R); }; }
  });
}

/* ---------- on-screen results ---------- */
function showResults(R){
  var best=MQ.readLocal(bestKey()), isBest=!best || R.score>best.score;
  if(isBest) MQ.saveLocal(bestKey(), { score:R.score, pct:R.pct, at:Date.now() });
  MQ.sound("win"); MQ.confetti(R.pct>=60?220:90);
  var col=function(p){ return p>=80?"#16a34a":p>=60?"#2563eb":p>=40?"#d97706":"#dc2626"; };
  function revList(filter){
    var rows=R.all.filter(function(r){ return filter==="all" || (filter==="wrong" && !r.ok) || (filter==="right" && r.ok); });
    if(!rows.length) return '<p class="muted center" style="font-weight:700;">Nothing to show here. Well done! 🎉</p>';
    return rows.map(function(r){
      var cls=r.ok?"ok":(r.blank?"blank":"no");
      return '<div class="rev '+cls+'"><span class="rb">'+(r.ok?"✅":(r.blank?"⬜":"❌"))+'</span>'+
        '<div class="rq">Q'+r.no+' · <span style="color:#2563eb">'+esc(r.section)+' · '+esc(r.skill)+'</span><br>'+esc(r.q)+'</div>'+
        '<div class="ra">Your answer: '+esc(r.your)+'</div>'+
        (r.ok?'':'<div class="ra" style="color:#0a8a3f;">Correct answer: '+esc(r.correct)+'</div>')+
        '<div class="solbox">💡 '+esc(r.why)+'</div></div>'; }).join("");
  }
  screen.innerHTML=
    '<div class="card center">'+
      '<div class="mascot" style="font-size:70px;">'+(R.pct>=80?"🏆":R.pct>=60?"🌟":R.pct>=40?"💪":"🌱")+'</div>'+
      '<h1>'+(R.timedOut?"⏰ Time's up! Test submitted":"Test submitted!")+'</h1>'+
      '<div class="row" style="margin:14px 0;gap:22px;">'+
        '<div><div class="big-num" style="font-size:52px;">'+R.score+'/'+R.total+'</div><div class="muted">Score</div></div>'+
        '<div><div class="big-num" style="font-size:52px;">'+R.pct+'%</div><div class="muted">Percentage</div></div>'+
        '<div><div class="big-num" style="font-size:52px;">'+R.minutes+'</div><div class="muted">Minutes</div></div></div>'+
      '<p style="font-size:22px;font-weight:800;color:'+R.bandCol+';margin:4px 0;">'+esc(R.band)+'</p>'+
      '<p style="font-weight:700;color:#4a4470;max-width:620px;margin:6px auto;">'+esc(R.bandNote)+'</p>'+
      (isBest?'<p style="font-weight:800;color:#3b5b7e;">🏅 New personal best!</p>':'<p style="font-weight:800;color:#3b5b7e;">Personal best: '+best.score+' / '+R.total+'</p>')+
      '<div id="mailbox" class="mailbox wait">📧 Preparing your report…</div>'+
      '<div class="row" style="margin-top:12px;">'+
        '<button class="btn green" id="dl">⬇️ Download report</button>'+
        '<button class="btn blue" id="pdf">🖨️ Save as PDF / Print</button></div>'+
      '<div class="row" style="margin-top:8px;"><button class="btn ghost" id="again">🔁 New attempt</button><a class="btn ghost" href="index.html" style="text-decoration:none;">📚 English hub</a></div>'+
    '</div>'+
    '<div class="card"><h2>📝 Summary</h2><p style="font-weight:700;color:#334155;font-size:17px;">'+esc(R.summary)+'</p>'+
      '<h3>Section results</h3>'+R.sections.map(function(s){ return '<div class="brk"><span class="bn">'+esc(s.name)+'</span><span class="bar"><i style="width:'+s.pct+'%;background:'+col(s.pct)+'"></i></span><span class="bs">'+s.c+'/'+s.n+'</span></div>'; }).join("")+
      '<h3>Skills analysis</h3>'+R.skills.map(function(s){ return '<div class="brk"><span class="bn">'+esc(s.name)+'</span><span class="bar"><i style="width:'+s.pct+'%;background:'+col(s.pct)+'"></i></span><span class="bs">'+s.c+'/'+s.n+'</span></div>'; }).join("")+
    '</div>'+
    '<div class="card"><h2>✅ Strengths</h2>'+(R.strengths.length?R.strengths.map(function(s){ return '<div class="str">'+esc(s)+'</div>'; }).join(""):'<p class="muted" style="font-weight:700;">Strengths appear here when a skill reaches 80%. Keep going!</p>')+
      '<h2>🎯 Targets and next steps</h2>'+(R.targets.length?R.targets.map(function(t){ return '<div class="tgt"><b>'+esc(t.skill)+' ('+esc(t.score)+')</b><br>'+esc(t.advice)+'</div>'; }).join(""):'<p class="muted" style="font-weight:700;">No skill below 60%. Brilliant! 🎉</p>')+
    '</div>'+
    '<div class="card"><h2>📋 Corrections</h2>'+
      '<div class="filt"><button class="btn ghost on" data-f="wrong">❌ To correct ('+R.corrections.length+')</button><button class="btn ghost" data-f="all">All '+R.total+'</button><button class="btn ghost" data-f="right">✅ Correct ('+R.score+')</button></div>'+
      '<div id="revList">'+revList("wrong")+'</div></div>';
  Array.prototype.forEach.call(document.querySelectorAll(".filt button"),function(b){
    b.onclick=function(){ document.querySelectorAll(".filt button").forEach(function(x){x.classList.remove("on");}); b.classList.add("on"); el("revList").innerHTML=revList(b.getAttribute("data-f")); };
  });
  el("dl").onclick=function(){ MQ.sound("click"); downloadReport(R); };
  el("pdf").onclick=function(){ MQ.sound("click"); printReport(R); };
  el("again").onclick=function(){ MQ.saveLocal(attemptKey(), null); intro(); };

  // 1) results row in the tutor's sheet (English tab)
  var skillScores={}; R.skills.forEach(function(s){ skillScores[s.name]=s.c+"/"+s.n; });
  MQ.logResult({ student:R.student, subject:"English", week:"", weekTitle:TEST_TITLE+" ("+R.total+" Q · "+TEST_MINUTES+" min)",
    accuracy:R.pct, correct:R.score, totalQuestions:R.total, stars:MQ.rating(R.pct).stars, rating:R.band, minutes:R.minutes, timedOut:R.timedOut,
    stages:{ sections:R.sections.map(function(s){return s.name+": "+s.c+"/"+s.n;}), skills:skillScores, missed:R.corrections.map(function(c){return c.no;}) },
    school:R.school, tutor:R.tutor });
  // 2) full analysis + corrections emailed to the tutor
  sendToTutor(R);
}

boot();
</script>
