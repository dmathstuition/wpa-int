var TRICKY=[
  {l:"Football shirt number", v:"10", e:"👕", t:"W", tricky:true, why:"Tricky! The 10 is a NAME for the shirt, not an amount. You can't add shirt numbers, so it's QUALITATIVE 🦜."},
  {l:"Bus route number", v:"42", e:"🚍", t:"W", tricky:true, why:"Tricky! Bus 42 isn't '42 buses' — it's a name/label. That makes it QUALITATIVE 🦜."},
  {l:"House number", v:"7", e:"🏠", t:"W", tricky:true, why:"Tricky! House number 7 is a label, not an amount — QUALITATIVE 🦜."}
];
function whyOf(it){
  if(it.tricky) return it.why;
  if(it.t==="N") return "“"+it.v+"” is a number we can "+(it.how==="measure"?"measure":"count")+" — <b>QUANTITATIVE</b> 🤖 (Quanti's numbers).";
  return "“"+it.v+"” is a describing word — <b>QUALITATIVE</b> 🦜 (Quali's words).";
}

/* =============================================================
   1) DISCOVER — guided discovery lesson
   ============================================================= */
function runDiscover(){
  cleanup();
  var col="#9b5cff";
  var maxClues=[
    {l:"Age", v:"4 years", e:"🎂", t:"N"},{l:"Colour", v:"brown", e:"🎨", t:"W"},{l:"Number of legs", v:"4", e:"🦵", t:"N"},
    {l:"Favourite toy", v:"ball", e:"🎾", t:"W"},{l:"Weight", v:"12 kg", e:"⚖️", t:"N"},{l:"Bark", v:"loud", e:"🔊", t:"W"}
  ];
  var counted=pickN(BANK.filter(function(b){return b.how==="count";}),1)[0];
  var measured=pickN(BANK.filter(function(b){return b.how==="measure";}),1)[0];
  var steps=[
    {k:"slide", html:"Hi, I'm <b>Detective Dot</b> 🕵️! <b>DATA</b> is information we collect — like the answers people give to a question. Detectives collect data as <b>clues</b>.<br><br>There are <b>two kinds</b> of data. Let's discover them ourselves!"},
    {k:"pick", items:shuffle(maxClues), instr:"🔎 Here are 6 clues about <b>Max the dog</b> 🐕. Tap ALL the clues whose answer is a <b>NUMBER</b>.",
      reveal:"Brilliant detective work! The <b>number</b> clues are called <b>QUANTITATIVE</b> data 🤖. The <b>describing-word</b> clues (brown, ball, loud) are called <b>QUALITATIVE</b> data 🦜."},
    {k:"heroes"},
    {k:"sort", items:shuffle(pickN(BANK.filter(function(b){return b.t==="N";}),4).concat(pickN(BANK.filter(function(b){return b.t==="W";}),4)))},
    {k:"slide", html:"Quanti 🤖 gets numbers in <b>two ways</b>:<br>🧮 <b>COUNT</b> them — how many pets, goals, books?<br>📏 <b>MEASURE</b> them — how tall, how heavy, how long it takes?<br><br>Quali 🦜 never counts or measures — Quali <b>describes</b>: colour, type, favourite, feelings."},
    {k:"mc", card:counted, q:"Was this number <b>counted</b> or <b>measured</b>?", options:["🧮 Counted","📏 Measured"], answer:0, why:"We count “"+counted.v+"” — one, two, three…"},
    {k:"mc", card:measured, q:"Was this number <b>counted</b> or <b>measured</b>?", options:["🧮 Counted","📏 Measured"], answer:1, why:"We need a measuring tool (ruler, scales, clock, thermometer…) for “"+measured.v+"”."},
    {k:"slide", html:"🔎 <b>Super-sleuth clue!</b> Some numbers are really <b>NAMES</b>. A football shirt <b>10</b>, the number <b>42</b> bus, house number <b>7</b>… You can't add them up or say one is “more” — they are <b>labels</b>, so they are <b>QUALITATIVE</b> 🦜!"},
    {k:"sort", items:[pickN(TRICKY,1)[0]]},
    {k:"mc", q:"Detective test: which question collects <b>QUANTITATIVE</b> data? 🤖", options:shuffle(["How many pencils are in your pencil case?","What colour is your pencil case?"]), answerText:"How many pencils are in your pencil case?",
      why:"“How many…?” gives a NUMBER answer — quantitative. “What colour…?” gives a word — qualitative."}
  ];
  var si=0, first=0, total=0;
  function next(){ si++; if(si>=steps.length) return done(); show(); }
  function show(){
    var s=steps[si], right=(si+1)+" / "+steps.length;
    if(s.k==="slide"){
      screen.innerHTML='<div class="card">'+head("🔍 Discover",col,right)+'<div style="display:flex;gap:14px;align-items:flex-start;margin-top:14px;"><div style="font-size:50px;line-height:1;">🕵️</div>'+
        '<div class="speech" style="text-align:left;margin:0;flex:1;">'+s.html+'</div></div><div class="center"><button class="btn big blue" id="nx" style="margin-top:16px;">Got it ▶</button></div></div>';
      el("nx").onclick=function(){ MQ.sound("click"); next(); }; return;
    }
    if(s.k==="heroes"){
      screen.innerHTML='<div class="card">'+head("🔍 Discover",col,right)+'<h2 class="center" style="margin-top:10px;">Meet the data detectives!</h2><div class="heroes">'+
        '<div class="hero qn"><div class="hx">🤖</div><h3>Quanti</h3><p>“I love <b>NUMBERS</b>! QUANTitative sounds like <b>QUANTity</b> — how many? how much? Like 3 pets, 132 cm, 15 minutes.”</p></div>'+
        '<div class="hero ql"><div class="hx">🦜</div><h3>Quali</h3><p>“I love <b>DESCRIBING WORDS</b>! QUALitative sounds like <b>QUALity</b> — what kind? what colour? Like blue, sunny, mango.”</p></div></div>'+
        '<div class="rule"><span style="background:#4b8bff">QUANTity → numbers 🤖</span><span style="background:#ff5b9a">QUALity → words 🦜</span></div>'+
        '<div class="center"><button class="btn big blue" id="nx" style="margin-top:16px;">Let\'s practise ▶</button></div></div>';
      el("nx").onclick=function(){ MQ.sound("click"); next(); }; return;
    }
    if(s.k==="pick"){
      screen.innerHTML='<div class="card">'+head("🔍 Discover",col,right)+'<div class="instr" style="margin-top:12px;">'+s.instr+'</div>'+
        '<div class="pickgrid" id="pg">'+s.items.map(function(it,i){ return '<button class="pick" data-i="'+i+'"><div class="de">'+it.e+'</div><div class="dl">'+it.l+'</div><div class="dv">'+it.v+'</div></button>'; }).join("")+'</div>'+
        '<div class="feedback" id="fb"></div><div class="center" id="ctl"><button class="btn green" id="ck">Check ✅</button></div></div>';
      var sel={}, firstTry=true;
      Array.prototype.forEach.call(document.querySelectorAll("#pg .pick"),function(b){
        b.onclick=function(){ var i=b.getAttribute("data-i"); if(sel[i]){delete sel[i];b.classList.remove("sel");}else{sel[i]=true;b.classList.add("sel");} MQ.sound("click"); };
      });
      el("ck").onclick=function(){
        var wrong=[], miss=[];
        s.items.forEach(function(it,i){ if(it.t==="N" && !sel[i]) miss.push(i); if(it.t!=="N" && sel[i]) wrong.push(i); });
        if(!wrong.length && !miss.length){
          total++; if(firstTry) first++;
          document.querySelectorAll("#pg .pick").forEach(function(b,i){ b.disabled=true; if(s.items[i].t==="N") b.classList.add("ok"); });
          MQ.sound("correct"); MQ.confetti(70);
          el("fb").className="feedback good"; el("fb").innerHTML='🎉 You found them!<div class="solbox">'+s.reveal+'</div>';
          el("ctl").innerHTML='<button class="btn big green" id="nx" style="margin-top:12px;">Next ▶</button>'; el("nx").onclick=function(){ MQ.sound("click"); next(); };
        } else {
          firstTry=false; MQ.sound("wrong");
          wrong.forEach(function(i){ var b=document.querySelector('#pg .pick[data-i="'+i+'"]'); b.classList.add("no"); setTimeout(function(){b.classList.remove("no");},450); });
          el("fb").className="feedback bad"; el("fb").textContent = wrong.length ? "One of those answers is a word, not a number — un-tap it." : "You've missed "+miss.length+" number clue"+(miss.length>1?"s":"")+" — look again!";
        }
      };
      return;
    }
    if(s.k==="sort"){ return sortSeq(s.items, function(f,t){ first+=f; total+=t; next(); }, "🔍 Discover", col, right); }
    if(s.k==="mc"){
      var ans = s.answerText ? s.options.indexOf(s.answerText) : s.answer;
      screen.innerHTML='<div class="card">'+head("🔍 Discover",col,right)+(s.card?cardHTML(s.card):"")+
        '<div class="center" style="margin:10px 0 4px;font-size:21px;font-weight:800;">'+s.q+'</div>'+
        '<div class="options" id="opts">'+s.options.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+o+'</button>';}).join("")+'</div>'+
        '<div class="feedback" id="fb"></div><div class="center" id="ctl"></div></div>';
      var ft=true;
      Array.prototype.forEach.call(document.querySelectorAll("#opts .opt"),function(b){
        b.onclick=function(){
          if(Number(b.getAttribute("data-i"))===ans){
            b.classList.add("correct"); document.querySelectorAll("#opts .opt").forEach(function(x){x.disabled=true;});
            total++; if(ft) first++; MQ.sound("correct"); MQ.confetti(50);
            el("fb").className="feedback good"; el("fb").innerHTML='🎉 Correct!<div class="solbox">💡 '+s.why+'</div>';
            el("ctl").innerHTML='<button class="btn big green" id="nx" style="margin-top:12px;">Next ▶</button>'; el("nx").onclick=function(){ MQ.sound("click"); next(); };
          } else { ft=false; b.classList.add("wrong"); b.disabled=true; MQ.sound("wrong"); el("fb").className="feedback bad"; el("fb").textContent="Not quite — try the other one. 💡"; }
        };
      });
    }
  }
  function done(){
    award("discover");
    var acc=total?Math.round(first/total*100):100;
    screen.innerHTML=finishCard("🔍","Clues cracked!","You discovered the two kinds of data, "+(student||"detective")+"! 🤖 <b>Quantitative</b> = numbers (counted or measured). 🦜 <b>Qualitative</b> = describing words.",acc,first,total,
      '<button class="btn big green" id="go">▶ Next: 📋 Class Survey Lab</button><button class="btn blue" id="mn">🕵️ Missions</button>');
    el("go").onclick=function(){ MQ.sound("click"); surveyMenu(); }; el("mn").onclick=function(){ MQ.sound("click"); menu(); };
    savedNote(logIt("Discover", acc, first, total));
  }
  show();
}

/* Sort a sequence of cards into the two bins (one at a time). onDone(firstTryCorrect, total) */
function sortSeq(items, onDone, title, col, right){
  var i=0, first=0;
  function show(){
    if(i>=items.length) return onDone(first, items.length);
    var it=items[i], ft=true;
    screen.innerHTML='<div class="card">'+head(title,col,right||("Card "+(i+1)+" / "+items.length))+
      '<div class="instr" style="margin-top:10px;">Is this data <b style="color:#4b8bff">Quantitative 🤖</b> or <b style="color:#ff5b9a">Qualitative 🦜</b>?</div>'+
      cardHTML(it)+binsHTML()+'<div class="feedback" id="fb"></div><div class="center" id="ctl"></div></div>';
    Array.prototype.forEach.call(document.querySelectorAll("#bins .bin"),function(b){
      b.onclick=function(){
        var c=el("dcard");
        if(b.getAttribute("data-t")===it.t){
          if(ft) first++;
          document.querySelectorAll("#bins .bin").forEach(function(x){x.disabled=true;});
          c.className="dcard good"; MQ.sound("correct"); MQ.confetti(40);
          el("fb").className="feedback good"; el("fb").innerHTML='🎉 Yes!<div class="solbox">'+whyOf(it)+'</div>';
          el("ctl").innerHTML='<button class="btn big green" id="nx" style="margin-top:12px;">Next ▶</button>';
          el("nx").onclick=function(){ MQ.sound("click"); i++; show(); };
        } else {
          ft=false; MQ.sound("wrong"); c.className="dcard"; void c.offsetWidth; c.className="dcard bad";
          el("fb").className="feedback bad"; el("fb").innerHTML = it.tricky ? "Hmm — is that number really an AMOUNT, or is it a name? 🤔" :
            (it.t==="N" ? "Look again — is “"+it.v+"” a number or a describing word?" : "Look again — can you count or measure “"+it.v+"”?");
        }
      };
    });
  }
  show();
}

function makeClass(sv){
  for(var tries=0;tries<200;tries++){
    var w=sv.cats.map(function(){ return 0.6+Math.random()*3; }), sum=w.reduce(function(a,b){return a+b;},0);
    var names=pickN(NAMES,12), faces=shuffle(FACES);
    var kids=names.map(function(n,i){
      var r=Math.random()*sum, c=0; for(var k=0;k<w.length;k++){ r-=w[k]; if(r<=0){ c=k; break; } c=k; }
      return { name:n, face:faces[i%faces.length], c:c };
    });
    var counts=sv.cats.map(function(){return 0;}); kids.forEach(function(k){ counts[k.c]++; });
    var mx=Math.max.apply(null,counts), nMax=counts.filter(function(x){return x===mx;}).length, used=counts.filter(function(x){return x>0;}).length;
    if(used>=3 && (sv.t==="N" || nMax===1)) return kids;
  }
  return kids;
}
function tallyHTML(n){
  var h="", g=Math.floor(n/5), r=n%5, line=function(x){ return '<line x1="'+x+'" y1="3" x2="'+x+'" y2="25" stroke="#2d2559" stroke-width="3" stroke-linecap="round"/>'; };
  for(var i=0;i<g;i++){ h+='<svg width="32" height="28" viewBox="0 0 32 28">'+line(5)+line(11)+line(17)+line(23)+'<line x1="1" y1="22" x2="28" y2="6" stroke="#e8455c" stroke-width="3" stroke-linecap="round"/></svg>'; }
  if(r){ var s='<svg width="'+(r*7+4)+'" height="28" viewBox="0 0 '+(r*7+4)+' 28">'; for(var j=0;j<r;j++) s+=line(4+j*7); h+=s+'</svg>'; }
  return h;
}
function barChartHTML(labels, counts, colour, yTitle){
  var mx=Math.max(1,Math.max.apply(null,counts));
  return '<p class="center" style="font-weight:800;margin:6px 0 0;">📊 '+yTitle+'</p><div class="bchart">'+counts.map(function(c){
      return '<div class="bc"><div class="bb" style="height:'+Math.round(c/mx*140)+'px;background:'+colour+';"><span>'+c+'</span></div></div>'; }).join("")+'</div>'+
    '<div class="blabels">'+labels.map(function(l){ return '<div>'+l+'</div>'; }).join("")+'</div>';
}
function numOpts(correct){
  var set=[correct], d=[1,-1,2,-2,3,-3,4,5,-4,6];
  for(var i=0;i<d.length && set.length<4;i++){ var v=correct+d[i]; if(v>=0 && set.indexOf(v)<0) set.push(v); }
  return shuffle(set);
}

function runSurvey(sv){
  cleanup();
  var col = sv.t==="N" ? "#4b8bff" : "#ff5b9a";
  var kids=makeClass(sv), counts=sv.cats.map(function(){return 0;}), ki=0, firstAll=0, totalAll=0, mistakes=0;
  var labelOf=function(c){ return sv.t==="N" ? c.k : c.e+" "+c.k; };

  // Step A: classify the survey question first
  screen.innerHTML='<div class="card">'+head(sv.e+" "+sv.title,col,"Step 1 · Predict")+
    '<div class="instr" style="margin-top:12px;">Our survey question is:</div><div class="dcard"><div class="de">'+sv.e+'</div><div class="dv" style="font-size:26px;">“'+sv.q+'”</div></div>'+
    '<div class="center" style="font-weight:800;font-size:20px;">🤔 What kind of data will the answers be?</div>'+binsHTML()+'<div class="feedback" id="fb"></div><div class="center" id="ctl"></div></div>';
  var ft=true;
  Array.prototype.forEach.call(document.querySelectorAll("#bins .bin"),function(b){
    b.onclick=function(){
      if(b.getAttribute("data-t")===sv.t){
        totalAll++; if(ft) firstAll++;
        document.querySelectorAll("#bins .bin").forEach(function(x){x.disabled=true;});
        MQ.sound("correct"); MQ.confetti(50);
        el("fb").className="feedback good";
        el("fb").innerHTML='🎉 Yes!<div class="solbox">'+(sv.t==="N" ? "The answers will be <b>numbers</b> (0, 1, 2…) — that's <b>QUANTITATIVE</b> data 🤖." : "The answers will be <b>words</b> (like "+sv.cats[0].k.toLowerCase()+" or "+sv.cats[1].k.toLowerCase()+") — that's <b>QUALITATIVE</b> data 🦜.")+'</div>';
        el("ctl").innerHTML='<button class="btn big green" id="nx" style="margin-top:12px;">🎤 Start interviewing ▶</button>';
        el("nx").onclick=function(){ MQ.sound("click"); interview(); };
      } else { ft=false; MQ.sound("wrong"); el("fb").className="feedback bad"; el("fb").textContent="Think: will people answer with a number, or with a word?"; }
    };
  });

  // Step B: interview each child and tally the answer
  function interview(){
    var k=kids[ki];
    var gridCols = sv.cats.length, still = ki>0 ? " still" : "";
    screen.innerHTML=
      '<div class="card'+still+'">'+head(sv.e+" "+sv.title,col,"Step 2 · Collect & record")+
        '<div class="kids">'+kids.map(function(x,i){ return '<span class="'+(i<ki?"done":i===ki?"cur":"")+'">'+x.face+'</span>'; }).join("")+'</div>'+
        (k ? '<div class="interview"><div class="kid">'+k.face+'</div><div><div style="font-weight:800;color:#6a62a0;">'+k.name+' says:</div><div class="bubble">'+sv.say(sv.cats[k.c])+'</div></div></div>'+
             '<div class="instr">👉 Tap the column that matches <b>'+k.name+'</b>\'s answer to add a <b>tally mark</b>. (Child '+(ki+1)+' of 12)</div>'
           : '<div class="instr">✅ All 12 children interviewed! Here is your finished tally chart.</div>')+
        '<div class="tcols" style="grid-template-columns:repeat('+gridCols+',1fr);">'+sv.cats.map(function(c,i){
          return '<button class="tcol" data-c="'+i+'"'+(k?'':' disabled')+'>'+(sv.t==="N"?'<span class="te" style="font-weight:800;color:#3a5bd9;">'+c.k+'</span><span class="th">'+sv.unit+'</span>':'<span class="te">'+c.e+'</span><span class="th">'+c.k+'</span>')+
            '<span class="tal">'+tallyHTML(counts[i])+'</span><span class="tn">'+counts[i]+'</span></button>'; }).join("")+'</div>'+
        '<div class="feedback" id="fb"></div><div class="center" id="ctl"></div>'+
      '</div>'+
      '<div class="card'+still+'" id="chartCard">'+barChartHTML(sv.cats.map(labelOf), counts, col, "Bar chart: "+sv.q+" (number of children)")+'</div>';
    if(!k){ el("ctl").innerHTML='<button class="btn big green" id="nx" style="margin-top:12px;">🔎 Investigate the results ▶</button>'; el("nx").onclick=function(){ MQ.sound("click"); questions(); }; return; }
    Array.prototype.forEach.call(document.querySelectorAll(".tcol"),function(b){
      b.onclick=function(){
        var c=Number(b.getAttribute("data-c"));
        if(c===k.c){ counts[c]++; ki++; MQ.sound("click"); interview(); var nb=document.querySelector('.tcol[data-c="'+c+'"]'); if(nb){ nb.classList.add("flash"); setTimeout(function(){ nb.classList.remove("flash"); },350); } if(ki===12){ MQ.sound("win"); MQ.confetti(100); } }
        else { mistakes++; MQ.sound("wrong"); b.classList.add("no"); setTimeout(function(){ b.classList.remove("no"); },450);
          el("fb").className="feedback bad"; el("fb").textContent="Listen again: "+k.name+" said “"+sv.say(sv.cats[k.c])+"”"; }
      };
    });
  }

  // Step C: interpret — and discover that only number data can be added up
  function questions(){
    var qs=[], labs=sv.cats.map(labelOf);
    if(sv.t==="W"){
      var mx=Math.max.apply(null,counts), mode=counts.indexOf(mx);
      qs.push({ q:"Which "+sv.thing+" is the <b>most popular</b>?", options:labs.slice(), answer:mode, why:labs[mode]+" has the tallest bar — "+mx+" children chose it." });
      var pool=[]; counts.forEach(function(c,i){ if(c>0 && i!==mode) pool.push(i); }); var pi=pool[Math.floor(Math.random()*pool.length)];
      var no=numOpts(counts[pi]);
      qs.push({ q:"How many children chose <b>"+labs[pi]+"</b>?", options:no.map(String), answer:no.indexOf(counts[pi]), why:"Count the tally marks for "+labs[pi]+": "+counts[pi]+"." });
      var a=sv.cats[0].k.toLowerCase(), b2=sv.cats[1].k.toLowerCase();
      qs.push({ q:"🤔 Can we <b>ADD UP</b> the answers themselves, like “"+a+" + "+b2+"”?", options:["No — they are words, not numbers!","Yes — "+a+" + "+b2+" = 2"], answer:0,
        why:"Qualitative data is <b>words</b>, so we can't add it up or find a total of it. We can only <b>count how many</b> people gave each answer — that's exactly how we made the tally chart and bar chart! 🦜" });
    } else {
      var maxV=-1; counts.forEach(function(c,i){ if(c>0) maxV=Math.max(maxV, sv.cats[i].n); });
      qs.push({ q:"What is the <b>largest</b> number of "+sv.unit+" anyone said?", options:labs.slice(), answer:labs.indexOf(String(maxV)), why:"Look for the biggest number that has at least one tally mark: "+maxV+"." });
      var tot=0, parts=[]; counts.forEach(function(c,i){ tot+=c*sv.cats[i].n; if(c>0 && sv.cats[i].n>0) parts.push(c+" × "+sv.cats[i].n); });
      var to=numOpts(tot);
      qs.push({ q:sv.totalQ, options:to.map(String), answer:to.indexOf(tot), why:"Because the data is <b>numbers</b>, we can add it: "+parts.join(" + ")+" = <b>"+tot+"</b> "+sv.unit+"." });
      qs.push({ q:"🤔 Can we <b>ADD UP</b> this data and do maths with it?", options:["Yes — it's numbers, so we can add, compare and find totals!","No — it's only words"], answer:0,
        why:"Quantitative data is <b>numbers</b>, so we can do maths with it: find the total, the biggest, the smallest and the difference. 🤖" });
    }
    var qi=0;
    function showQ(){
      if(qi>=qs.length) return finish();
      var q=qs[qi], ft=true;
      screen.innerHTML='<div class="card">'+head(sv.e+" "+sv.title,col,"Step 3 · Investigate "+(qi+1)+"/"+qs.length)+
        '<div class="center" style="margin:12px 0 4px;font-size:21px;font-weight:800;">'+q.q+'</div>'+
        '<div class="options" id="opts">'+q.options.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+o+'</button>';}).join("")+'</div>'+
        '<div class="feedback" id="fb"></div><div class="center" id="ctl"></div></div>'+
        '<div class="card" id="chartCard">'+barChartHTML(labs, counts, col, "Our results — "+sv.q)+'</div>';
      Array.prototype.forEach.call(document.querySelectorAll("#opts .opt"),function(b){
        b.onclick=function(){
          if(Number(b.getAttribute("data-i"))===q.answer){
            b.classList.add("correct"); document.querySelectorAll("#opts .opt").forEach(function(x){x.disabled=true;});
            totalAll++; if(ft) firstAll++; MQ.sound("correct"); MQ.confetti(50);
            el("fb").className="feedback good"; el("fb").innerHTML='🎉 Correct!<div class="solbox">💡 '+q.why+'</div>';
            el("ctl").innerHTML='<button class="btn big green" id="nx" style="margin-top:12px;">Next ▶</button>'; el("nx").onclick=function(){ MQ.sound("click"); qi++; showQ(); };
          } else { ft=false; b.classList.add("wrong"); b.disabled=true; MQ.sound("wrong"); el("fb").className="feedback bad"; el("fb").textContent="Not quite — look at the chart and try again. 📊"; }
        };
      });
    }
    showQ();
  }

  function finish(){
    var p=prog(); p.surveys[sv.id]=true; saveProg(p);
    var hasN=SURVEYS.some(function(s){return s.t==="N"&&p.surveys[s.id];}), hasW=SURVEYS.some(function(s){return s.t==="W"&&p.surveys[s.id];});
    if(hasN&&hasW) award("survey");
    var acc=totalAll?Math.round(firstAll/totalAll*100):100;
    var need = !(hasN&&hasW) ? '<p style="font-weight:800;color:#5b5390;">Now run a '+(hasN?"Quali 🦜":"Quanti 🤖")+' survey to earn the 📋 Surveyor badge!</p>' : '';
    screen.innerHTML=finishCard(sv.e,"Survey complete!",
      "Great research, "+(student||"detective")+"! Your “"+sv.title+"” survey collected <b>"+(sv.t==="N"?"QUANTITATIVE 🤖 (number)":"QUALITATIVE 🦜 (word)")+"</b> data from 12 children, and you recorded every answer with tally marks."+need,
      acc,firstAll,totalAll,'<button class="btn big green" id="more">📋 Run another survey</button><button class="btn blue" id="mn">🕵️ Missions</button>');
    el("more").onclick=function(){ MQ.sound("click"); surveyMenu(); }; el("mn").onclick=function(){ MQ.sound("click"); menu(); };
    var res={}; sv.cats.forEach(function(c,i){ res[c.k]=counts[i]; });
    savedNote(logIt("Survey: "+sv.title, acc, firstAll, totalAll, { type:sv.t==="N"?"quantitative":"qualitative", results:res, tallyMistakes:mistakes }));
  }
}

function rushIntro(){

    (p.rushBest?'<p style="font-size:20px;font-weight:800;">🏆 Your best: '+p.rushBest+'</p>':'')+
    '<div class="row"><button class="btn big green" id="go">▶ GO!</button><button class="btn ghost" id="mn">🕵️ Missions</button></div></div>';
  el("go").onclick=function(){ MQ.sound("level"); runRush(); };
  el("mn").onclick=function(){ MQ.sound("click"); menu(); };
}
function runRush(){
  cleanup();
  var DUR=60000, end=Date.now()+DUR, score=0, streak=0, bestStreak=0, right=0, done=0, lock=false, over=false, misses=[];
  var deck=shuffle(BANK), di=0;
  function nextCard(){ if(di>=deck.length){ deck=shuffle(BANK); di=0; } return deck[di++]; }
  var cur=nextCard();
  screen.innerHTML='<div class="card">'+
      '<div class="rushtop"><span>⏱ <b id="tl">60</b>s</span><span>⭐ Score <b id="sc">0</b></span><span>🔥 <b id="st">0</b></span></div>'+
      '<div class="tbar" id="tb"><i id="tf" style="width:100%"></i></div>'+
      '<div id="cardHost"></div>'+binsHTML()+'<div class="feedback" id="fb" style="min-height:56px;"></div></div>';
  function paintCard(){ el("cardHost").innerHTML=cardHTML(cur); }
  function answer(t){
    if(lock||over) return;
    done++;
    var c=el("dcard");
    if(t===cur.t){
      right++; streak++; bestStreak=Math.max(bestStreak,streak);
      var pts=10+(streak>=6?10:streak>=3?5:0); score+=pts;
      MQ.sound("correct"); if(streak%5===0) MQ.confetti(40);
      el("fb").className="feedback good"; el("fb").textContent="+"+pts+(streak>=3?"  🔥 x"+streak:"");
      cur=nextCard(); paintCard();
    } else {
      streak=0; lock=true; misses.push(cur); MQ.sound("wrong");
      c.className="dcard bad";
      el("fb").className="feedback bad"; el("fb").innerHTML="It was "+TY(cur.t).e+" <b>"+TY(cur.t).name.toUpperCase()+"</b> — "+(cur.t==="N"?"“"+cur.v+"” is a number":"“"+cur.v+"” is a describing word");
      setTimeout(function(){ if(over) return; lock=false; cur=nextCard(); paintCard(); },1100);
    }
    el("sc").textContent=score; el("st").textContent=streak;
  }
  Array.prototype.forEach.call(document.querySelectorAll("#bins .bin"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-t")); }; });
  var keyH=function(e){ if(e.key==="ArrowLeft"){ e.preventDefault(); answer("N"); } else if(e.key==="ArrowRight"){ e.preventDefault(); answer("W"); } };
  document.addEventListener("keydown",keyH);
  var iv=setInterval(function(){
    var left=Math.max(0,end-Date.now());
    var tl=el("tl"), tf=el("tf"), tb=el("tb"); if(!tl){ clearInterval(iv); return; }
    tl.textContent=Math.ceil(left/1000); tf.style.width=(left/DUR*100)+"%"; tb.classList.toggle("hot", left<15000);
    if(left<=0){ clearInterval(iv); finish(); }
  },100);
  cleanups.push(function(){ clearInterval(iv); document.removeEventListener("keydown",keyH); over=true; });
  paintCard();

  function finish(){
    over=true; document.removeEventListener("keydown",keyH);
    var p=prog(), newBest=score>(p.rushBest||0); if(newBest){ p.rushBest=score; saveProg(p); }
    if(score>=100) award("rush");
    var acc=done?Math.round(right/done*100):0;
    var uniq=[]; misses.forEach(function(m){ if(uniq.indexOf(m)<0) uniq.push(m); });
    var review = uniq.length ? '<div class="card"><h2>🔎 Cards to remember</h2>'+uniq.map(function(m){ return '<div class="solbox">'+m.e+' <b>'+m.l+': '+m.v+'</b> → '+TY(m.t).e+' '+TY(m.t).name+'<br><span style="font-size:15px;">'+whyOf(m)+'</span></div>'; }).join("")+'</div>' : '';
    screen.innerHTML='<div class="card center"><div class="mascot" style="font-size:72px;">'+(newBest?"🏆":"🏁")+'</div><h1>'+(newBest?"NEW BEST SCORE!":"Time's up!")+'</h1>'+
      '<div class="row" style="margin:14px 0;gap:24px;"><div><div class="big-num" style="font-size:52px;">'+score+'</div><div class="muted">Score</div></div>'+
      '<div><div class="big-num" style="font-size:52px;">'+right+'/'+done+'</div><div class="muted">Sorted right</div></div>'+
      '<div><div class="big-num" style="font-size:52px;">🔥'+bestStreak+'</div><div class="muted">Best streak</div></div></div>'+
      '<p style="font-weight:800;color:#5b5390;">'+(score>=100?"🏅 Speed Sorter badge unlocked!":"Score 100 or more to unlock the 🏁 Speed Sorter badge!")+'</p>'+
      '<p class="muted" id="saveState">💾 Saving…</p><div class="row"><button class="btn big green" id="again">🔁 Play again</button><button class="btn blue" id="mn">🕵️ Missions</button></div></div>'+review;
    MQ.sound("win"); MQ.confetti(newBest?220:120);
    el("again").onclick=function(){ MQ.sound("level"); runRush(); }; el("mn").onclick=function(){ MQ.sound("click"); menu(); };
    savedNote(logIt("Sort Rush", acc, right, done, { score:score, bestStreak:bestStreak, missed:uniq.map(function(m){return m.l+": "+m.v;}) }));
  }
}

/* =============================================================
   5) QUESTION FACTORY — choose the question that gives the right data
   ============================================================= */
function factoryRound(topic, target){
  var other=target==="N"?"W":"N";
  var correct=pickN(topic[target],1)[0];
  var wrongs=pickN(topic[other],1);
  var otherTopic=pickN(TOPICS.filter(function(t){return t!==topic;}),1)[0];
  wrongs.push(pickN(otherTopic[other],1)[0]);
  var opts=shuffle([correct].concat(wrongs));
  return { topic:topic, target:target, options:opts, answer:opts.indexOf(correct), correct:correct };
}
function runFactory(){
  cleanup();
  var ROUNDS=8, r=0, first=0, col="#ffb020";

/* =============================================================
   6) MY OWN SURVEY — real-life practical (ask real people)

function guessType(q){
  q=(q||"").toLowerCase();
  if(/how (many|much|long|tall|old|far|heavy|fast|often|big|high|wide)|what time|what is your (age|height|shoe size)/.test(q)) return "N";
  if(/what (colou?r|kind|type|sort)|which|favou?rite|what is your name|how do you|how did you feel|what .* like/.test(q)) return "W";
  return null;
}
function runOwn(){
  cleanup();
  var col="#ff5b9a", own={ q:"", t:null, answers:[] };
  function step1(){
    screen.innerHTML='<div class="card">'+head("🗣️ My Own Survey",col,"Step 1 · Write a question")+

  function step2(){

      '<div class="dcard"><div class="de">🗣️</div><div class="dv" style="font-size:24px;">“'+own.q.replace(/</g,"&lt;")+'”</div></div>'+

    Array.prototype.forEach.call(document.querySelectorAll("#bins .bin"),function(b){

          el("sure").onclick=function(){ own.t=t; step3(); };
          return;
        }
        own.t=t; MQ.sound("correct"); step3();
      };
    });
  }
  function groups(){
    var g={}; own.answers.forEach(function(a){ g[a]=(g[a]||0)+1; });
    var keys=Object.keys(g);
    if(own.t==="N") keys.sort(function(a,b){return Number(a)-Number(b);}); else keys.sort(function(a,b){return g[b]-g[a]||a.localeCompare(b);});
    return { keys:keys, counts:keys.map(function(k){return g[k];}) };
  }
  function step3(warnFor){

    screen.innerHTML='<div class="card'+(own.answers.length?" still":"")+'">'+head("🗣️ My Own Survey",col,"Step 3 · Collect real data")+
      '<div class="speech" style="margin-top:12px;">🎤 Go and ask <b>real people</b>: “'+own.q.replace(/</g,"&lt;")+'”<br>Type each answer and press <b>➕ Add</b>. You chose '+T.e+' <b>'+T.name+'</b>, so answers should be <b>'+(own.t==="N"?"numbers":"words")+'</b>. Collect at least <b>5</b>.</div>'+
      '<div class="row" style="margin-top:12px;"><input class="pill-input" id="ans" placeholder="'+(own.t==="N"?"Type a number, e.g. 3":"Type the answer, e.g. blue")+'" maxlength="24" '+(own.t==="N"?'inputmode="decimal"':'')+' style="flex:1 1 200px;"><button class="btn green" id="add">➕ Add</button></div>'+
      '<div class="feedback" id="fb"></div>'+
      (own.answers.length ? '<table class="res" style="width:100%;border-collapse:collapse;margin-top:10px;font-weight:800;"><tr><th style="border:2px solid var(--line);padding:6px;">Answer</th><th style="border:2px solid var(--line);padding:6px;">Tally</th><th style="border:2px solid var(--line);padding:6px;">Total</th></tr>'+
        G.keys.map(function(k,i){ return '<tr><td style="border:2px solid var(--line);padding:6px;text-align:center;">'+k.replace(/</g,"&lt;")+'</td><td style="border:2px solid var(--line);padding:6px;">'+tallyHTML(G.counts[i])+'</td><td style="border:2px solid var(--line);padding:6px;text-align:center;">'+G.counts[i]+'</td></tr>'; }).join("")+'</table>'+
        barChartHTML(G.keys.map(function(k){return k.replace(/</g,"&lt;");}), G.counts, T.col, "Number of people") : '<p class="muted center" style="font-weight:700;">Your tally chart and bar chart will build here. 📊</p>')+
      '<div class="center" style="margin-top:12px;"><button class="btn big blue" id="fin"'+(own.answers.length<5?' disabled':'')+'>✅ I\'ve finished collecting ('+own.answers.length+')</button></div></div>';
    var inp=el("ans"); inp.focus();
    function add(force){
      var v=inp.value.trim(); if(!v) return;
      var isNum=/^-?\d+(\.\d+)?$/.test(v);
      if(own.t==="N" && !isNum){ MQ.sound("wrong"); el("fb").className="feedback bad"; el("fb").innerHTML="🤖 Quanti only collects <b>numbers</b>! Type just the number (e.g. <b>3</b>, not “three pets”)."; return; }
      if(own.t==="W" && isNum && !force){ MQ.sound("wrong"); el("fb").className="feedback bad";
        el("fb").innerHTML="🦜 That's a number! Qualitative answers are usually <b>words</b>. (Unless it's a name, like a shirt number.) <button class='btn ghost' id='anyway'>Add anyway</button>";
        el("anyway").onclick=function(){ add(true); }; return; }
      var norm = own.t==="N" ? String(Number(v)) : v.charAt(0).toUpperCase()+v.slice(1).toLowerCase();
      own.answers.push(norm); MQ.sound("click"); step3();
    }
    el("add").onclick=function(){ add(false); };
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter") add(false); });
    el("fin").onclick=function(){ if(own.answers.length>=5){ MQ.sound("click"); step4(); } };
  }
  function step4(){
    var T=TY(own.t), G=groups(), facts="";
    if(own.t==="N"){
      var nums=own.answers.map(Number), tot=nums.reduce(function(a,b){return a+b;},0), mx=Math.max.apply(null,nums), mn=Math.min.apply(null,nums);
      facts='<div class="solbox">🤖 Because your data is <b>numbers</b>, you can do maths with it!<br>➕ Total: <b>'+(Math.round(tot*100)/100)+'</b> &nbsp; ⬆️ Biggest: <b>'+mx+'</b> &nbsp; ⬇️ Smallest: <b>'+mn+'</b> &nbsp; ↔️ Difference: <b>'+(Math.round((mx-mn)*100)/100)+'</b></div>';
    } else {
      var top=G.counts[0], winners=G.keys.filter(function(k,i){return G.counts[i]===top;});
      facts='<div class="solbox">🦜 Because your data is <b>words</b>, we can\'t add it up — but we can <b>count each group</b>.<br>🏆 Most popular: <b>'+winners.join(" and ").replace(/</g,"&lt;")+'</b> ('+top+' '+(top===1?"person":"people")+') &nbsp; 🔢 Different answers: <b>'+G.keys.length+'</b></div>';
    }
    award("own");
    screen.innerHTML='<div class="card center"><div class="mascot" style="font-size:70px;">🗣️</div><h1>Real research done!</h1>'+
      '<div class="speech">You asked <b>'+own.answers.length+' real people</b> “'+own.q.replace(/</g,"&lt;")+'” and collected '+T.e+' <b>'+T.name.toUpperCase()+'</b> data. 🏅 Field Researcher badge!</div>'+
      barChartHTML(G.keys.map(function(k){return k.replace(/</g,"&lt;");}), G.counts, T.col, "My survey results (number of people)")+facts+
      '<p class="muted" id="saveState">💾 Saving…</p><div class="row" style="margin-top:8px;"><button class="btn green" id="again">🗣️ New survey</button><button class="btn blue" id="mn">🕵️ Missions</button></div></div>';
    MQ.sound("win"); MQ.confetti(180);
    el("again").onclick=function(){ MQ.sound("click"); runOwn(); }; el("mn").onclick=function(){ MQ.sound("click"); menu(); };
    savedNote(logIt("My Own Survey", 100, own.answers.length, own.answers.length, { question:own.q, type:own.t==="N"?"quantitative":"qualitative", answers:own.answers }));
  }
  step1();
}

/* =============================================================
   7) MASTERY CHECK — 10 questions, one try each
   ============================================================= */
function runMastery(){
  cleanup();
  var col="#c98a5e", Q=[];
  var sortItems=shuffle(pickN(BANK.filter(function(b){return b.t==="N";}),3).concat(pickN(BANK.filter(function(b){return b.t==="W";}),2)).concat(pickN(TRICKY,1)));
  sortItems.forEach(function(it){ Q.push({k:"sort", it:it}); });
  ["N","W"].forEach(function(maj){
    var min=maj==="N"?"W":"N";
    var cards=shuffle(pickN(BANK.filter(function(b){return b.t===maj;}),3).concat(pickN(BANK.filter(function(b){return b.t===min;}),1)));
    var opts=cards.map(function(c){return c.e+" "+c.l+": "+c.v;});
    var odd=cards.filter(function(c){return c.t===min;})[0];
    Q.push({k:"mc", q:"Which is the <b>odd one out</b>?", options:opts, answer:cards.indexOf(odd), why:"“"+odd.v+"” is "+TY(min).name.toLowerCase()+" — the others are "+TY(maj).name.toLowerCase()+"."});
  });
  var t1=pickN(TOPICS,2);
  [["N",t1[0]],["W",t1[1]]].forEach(function(x){
    var R=factoryRound(x[1], x[0]);
    Q.push({k:"mc", q:"Which question collects <b>"+TY(x[0]).name.toUpperCase()+"</b> "+TY(x[0]).e+" data about "+x[1].name+"?", options:R.options, answer:R.answer, why:"“"+R.correct+"” gets "+(x[0]==="N"?"number":"word")+" answers."});
  });
  var addOpts=shuffle(["Goals scored: 5, 3, 2","Favourite colours: red, blue, green"]);
  Q.push({k:"mc", q:"Which data can you <b>add up</b> to find a total?", options:addOpts, answer:addOpts.indexOf("Goals scored: 5, 3, 2"), why:"Goals are numbers (quantitative), so 5 + 3 + 2 = 10. Colours are words — you can't add them."});
  Q=shuffle(Q).slice(0,10);
  var qi=0, score=0, wrongs=[];
  function show(){
    if(qi>=Q.length) return finish();
    var q=Q[qi], right="Question "+(qi+1)+" / "+Q.length;
    if(q.k==="sort"){
      screen.innerHTML='<div class="card">'+head("🏆 Mastery Check",col,right)+'<div class="instr" style="margin-top:10px;">Quantitative 🤖 or Qualitative 🦜? <b>One try!</b></div>'+cardHTML(q.it)+binsHTML()+
        '<div class="feedback" id="fb"></div><div class="center" id="ctl"></div></div>';
      Array.prototype.forEach.call(document.querySelectorAll("#bins .bin"),function(b){
        b.onclick=function(){
          var ok=b.getAttribute("data-t")===q.it.t; document.querySelectorAll("#bins .bin").forEach(function(x){x.disabled=true;});
          mark(ok, whyOf(q.it), q.it.l+": "+q.it.v); el("dcard").className="dcard "+(ok?"good":"bad");
        };
      });
    } else {
      screen.innerHTML='<div class="card">'+head("🏆 Mastery Check",col,right)+'<div class="center" style="margin:12px 0 4px;font-size:21px;font-weight:800;">'+q.q+'</div>'+
        '<div class="options" id="opts" style="grid-template-columns:1fr;">'+q.options.map(function(o,i){return '<button class="opt" data-i="'+i+'" style="font-size:18px;">'+o+'</button>';}).join("")+'</div>'+
        '<div class="feedback" id="fb"></div><div class="center" id="ctl"></div></div>';
      Array.prototype.forEach.call(document.querySelectorAll("#opts .opt"),function(b){
        b.onclick=function(){
          var i=Number(b.getAttribute("data-i")), ok=i===q.answer;
          document.querySelectorAll("#opts .opt").forEach(function(x,j){ x.disabled=true; if(j===q.answer) x.classList.add("correct"); });
          if(!ok) b.classList.add("wrong");
          mark(ok, q.why, q.q.replace(/<[^>]+>/g,""));
        };
      });
    }
  }
  function mark(ok, why, label){
    if(ok){ score++; MQ.sound("correct"); MQ.confetti(40); } else { MQ.sound("wrong"); wrongs.push(label); }
    el("fb").className="feedback "+(ok?"good":"bad");
    el("fb").innerHTML=(ok?"🎉 Correct!":"❌ Not this time.")+'<div class="solbox">💡 '+why+'</div>';
    el("ctl").innerHTML='<button class="btn big green" id="nx" style="margin-top:12px;">'+(qi+1>=Q.length?"See my result ▶":"Next ▶")+'</button>';
    el("nx").onclick=function(){ MQ.sound("click"); qi++; show(); };
  }
  function finish(){
    var acc=Math.round(score/Q.length*100); if(acc>=80) award("mastery");
    var p=prog(); p.masteryBest=Math.max(p.masteryBest||0,acc); saveProg(p);
    screen.innerHTML=finishCard(acc>=80?"🏆":"🕵️", acc>=80?"You're a Data Detective!":"Good investigating!",
      (acc>=80?"🏅 Mastery badge earned, "+(student||"detective")+"! You can tell quantitative and qualitative data apart like a pro.":"Score 8 or more to earn the 🏆 Data Detective badge. Try Sort Rush and Odd One Out, then come back!"),
      acc,score,Q.length,'<button class="btn big green" id="again">🔁 Try again</button><button class="btn blue" id="mn">🕵️ Missions</button>');
    el("again").onclick=function(){ MQ.sound("click"); runMastery(); }; el("mn").onclick=function(){ MQ.sound("click"); menu(); };
    savedNote(logIt("Mastery Check", acc, score, Q.length, { missed:wrongs }));
  }
  show();
}

boot();
</script>
